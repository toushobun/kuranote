name: Temporary schema snapshot update for #464

on:
  push:
    branches:
      - fix/464_ledger_invite_ambiguous_column

permissions:
  contents: write

jobs:
  update-schema-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Update schema snapshot
        run: npm run db:schema:snapshot:update

      - name: Commit generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "Schema snapshot is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
