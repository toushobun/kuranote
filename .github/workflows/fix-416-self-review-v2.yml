name: Fix 416 Self Review V2

on:
  push:
    branches:
      - feature/416_transaction_consumer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/416_transaction_consumer
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {pattern}")
              file.write_text(updated)

          def insert_before_once(path: str, marker: str, content: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(marker) != 1:
                  raise SystemExit(f"{path}: marker mismatch: {marker}")
              file.write_text(text.replace(marker, content + marker, 1))

          path = "src/internal/transaction/adapter/next/actions.ts"
          sub_once(path, r'(await service\.createTransfer\(\{\n)(\s+)(accountId: values\.accountId,\n)', r'\1\2\3\2consumerUserIds: values.consumerUserIds,\n')
          sub_once(path, r'(\)\.updateTransfer\(\{\n)(\s+)(accountId: values\.accountId,\n)', r'\1\2\3\2consumerUserIds: values.consumerUserIds,\n')
          sub_once(path, r'(await service\.convert\(\{\n)(\s+)(accountId: values\.accountId,\n)(\s+ledgerId: currentLedger\.id,\n\s+note: values\.note,\n\s+targetType: "transfer",)', r'\1\2\3\2consumerUserIds: values.consumerUserIds,\n\4')
          sub_once(path, r'(await service\.convert\(\{\n)(\s+)(accountId: values\.accountId,\n)(\s+items: values\.items,)', r'\1\2\3\2consumerUserIds: values.consumerUserIds,\n\4')

          path = "src/internal/transaction/schema.ts"
          sub_once(path, r'(const transferTransactionRequestSchema = z\.object\(\{\n)(\s+)(accountId: z\.string\(\)\.uuid\(\),\n)', r'\1\2\3\2consumerUserIds: z.array(z.string().uuid()).min(1).optional(),\n')

          path = "src/internal/transaction/controller/transactionController.ts"
          sub_once(path, r'(await service\.createTransfer\(\{\n)(\s+)(accountId: input\.accountId,\n)', r'\1\2\3\2consumerUserIds: input.consumerUserIds,\n')
          sub_once(path, r'(await service\.updateTransfer\(\{\n)(\s+)(accountId: input\.accountId,\n)', r'\1\2\3\2consumerUserIds: input.consumerUserIds,\n')

          path = "src/internal/transaction/service/read/transactionFormService.ts"
          sub_once(path, r'  if \(incomeTotal > expenseTotal\) return "income";\n  return "expense";', '  if (incomeTotal > expenseTotal) return "income";\n  if (expenseTotal > incomeTotal) return "expense";\n  return "income";')
          sub_once(path, r'export function formatEditableAmount\(amount: string, currency\?: string\) \{\n  const numericAmount = Number\(amount\);\n  if \(!Number\.isFinite\(numericAmount\)\) return amount;\n  return String\(\n    Number\(numericAmount\.toFixed\(getAmountDecimalPlaces\(currency\)\)\),\n  \);\n\}', 'export function formatEditableAmount(amount: string, currency?: string) {\n  const value = Number(amount);\n  if (!Number.isFinite(value)) return amount;\n  return String(Number(value.toFixed(getAmountDecimalPlaces(currency))));\n}')

          path = "src/internal/transaction/repository/transactionRepository.ts"
          sub_once(path, r'(\.from\("app_user"\)\n\s+\.select\("id, display_name"\)\n\s+\.in\("id", uniqueUserIds\))\n\s+\.eq\("status", "active"\),', r'\1,')

          path = "src/components/organisms/transactions/TransactionForm/TransactionConsumerSelector.tsx"
          sub_once(path, r'(import \{ useEditTransactionDirty \} from "organisms/transactions/EditTransactionDirtyContext/EditTransactionDirtyContext";\n)', r'\1import { designTokens } from "theme/theme";\n')
          sub_once(path, r'(\} from "theme/themeColorTokens";\n)', r'\1import { userThemeCardBorderSx } from "theme/userThemeCardSx";\n')
          sub_once(path, r'sx=\{\{\n\s+color: "var\(--user-theme-action-text\)",\n\s+fontSize: "0\.9rem",\n\s+fontWeight: 800,\n\s+minHeight: 38,\n\s+px: 1\.25,\n\s+\}\}', 'sx={{\n            ...userThemeCardBorderSx,\n            borderRadius: `${designTokens.radius.lg}px`,\n            color: "var(--user-theme-action-text)",\n            fontSize: "0.9rem",\n            fontWeight: 800,\n            minHeight: 38,\n            width: "100%",\n          }}')

          path = "src/internal/transaction/adapter/next/actions.test.ts"
          sub_once(path, r'(  const merchantId = "00000000-0000-4000-8000-000000001001";\n)', r'\1  const consumerA = "00000000-0000-4000-8000-000000000031";\n  const consumerB = "00000000-0000-4000-8000-000000000033";\n')
          sub_once(path, r'(    formData\.set\("note", "转账备注"\);\n)(    return formData;)', r'\1    formData.append("consumerUserId", consumerA);\n    formData.append("consumerUserId", consumerB);\n\2')
          sub_once(path, r'(expect\(mocks\.createTransfer\)\.toHaveBeenCalledWith\(\{\n\s+accountId,\n)', r'\1      consumerUserIds: [consumerA, consumerB],\n')
          sub_once(path, r'(expect\.objectContaining\(\{\n\s+accountId,\n)(\s+ledgerId,\n\s+targetType: "transfer",)', r'\1        consumerUserIds: [consumerA, consumerB],\n\2')
          insert_before_once(path, '  it("转账保持转账类型时由 saveEditTransaction 调用 updateTransfer", async () => {', '''  it("转账转换为普通交易时保留消费者", async () => {\n    const formData = createNormalFormData({ sourceType: "transfer" });\n    formData.append("consumerUserId", consumerA);\n    formData.append("consumerUserId", consumerB);\n    await expect(saveEditTransaction({}, formData)).rejects.toThrow(\n      "NEXT_REDIRECT:/transactions?month=2026-06&result=updated",\n    );\n    expect(mocks.convert).toHaveBeenCalledWith(\n      expect.objectContaining({\n        consumerUserIds: [consumerA, consumerB],\n        targetType: "expense",\n        transactionRecordId,\n      }),\n    );\n  });\n''')
          sub_once(path, r'expect\(mocks\.updateTransfer\)\.toHaveBeenCalledWith\(\n\s+expect\.objectContaining\(\{ ledgerId, transactionRecordId \}\),\n\s+\);', 'expect(mocks.updateTransfer).toHaveBeenCalledWith(\n      expect.objectContaining({\n        consumerUserIds: [consumerA, consumerB],\n        ledgerId,\n        transactionRecordId,\n      }),\n    );')

          path = "src/internal/transaction/controller/transactionController.test.ts"
          sub_once(path, r'(const userId = "00000000-0000-4000-8000-000000000031";\n)', r'\1const consumerUserIds = [\n  "00000000-0000-4000-8000-000000000031",\n  "00000000-0000-4000-8000-000000000033",\n];\n')
          sub_once(path, r'(const transferInput = \{\n\s+accountId,\n)', r'\1  consumerUserIds,\n')
          sub_once(path, r'(expect\(service\.createTransfer\)\.toHaveBeenCalledWith\(\{\n\s+accountId,\n)', r'\1      consumerUserIds,\n')
          sub_once(path, r'(expect\(service\.updateTransfer\)\.toHaveBeenCalledWith\(\{\n\s+accountId,\n)', r'\1      consumerUserIds,\n')

          path = "src/internal/transaction/transactionConsumerSchema.test.ts"
          sub_once(path, r'import \{ validateTransactionForm \} from "internal/transaction/schema";', 'import {\n  convertTransactionRequestSchema,\n  createTransactionRequestSchema,\n  updateTransactionRequestSchema,\n  validateTransactionForm,\n} from "internal/transaction/schema";')
          insert_before_once(path, '  it("未提交消费者时保持 undefined 交由默认消费者逻辑处理", () => {', '''  it("JSON 转账创建、更新和类型转换请求都保留消费者", () => {\n    const transferRequest = {\n      accountId,\n      consumerUserIds: [consumerA, consumerB],\n      ledgerId: "00000000-0000-4000-8000-000000000099",\n      note: null,\n      transactionAt: "2026-09-08T03:30:00.000Z",\n      transferAmount: 1200,\n      transferTargetAccountId: "00000000-0000-4000-8000-000000000042",\n      type: "transfer" as const,\n    };\n\n    expect(createTransactionRequestSchema.parse(transferRequest)).toMatchObject({\n      consumerUserIds: [consumerA, consumerB],\n    });\n    expect(updateTransactionRequestSchema.parse(transferRequest)).toMatchObject({\n      consumerUserIds: [consumerA, consumerB],\n    });\n    expect(\n      convertTransactionRequestSchema.parse({\n        accountId: transferRequest.accountId,\n        consumerUserIds: transferRequest.consumerUserIds,\n        ledgerId: transferRequest.ledgerId,\n        note: transferRequest.note,\n        targetType: "transfer",\n        transactionAt: transferRequest.transactionAt,\n        transferAmount: transferRequest.transferAmount,\n        transferTargetAccountId: transferRequest.transferTargetAccountId,\n      }),\n    ).toMatchObject({ consumerUserIds: [consumerA, consumerB] });\n  });\n\n''')
          PY

      - name: Format
        run: |
          npx --yes prettier@3.8.3 --write \
            src/internal/transaction/adapter/next/actions.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/controller/transactionController.ts \
            src/internal/transaction/service/read/transactionFormService.ts \
            src/internal/transaction/repository/transactionRepository.ts \
            src/components/organisms/transactions/TransactionForm/TransactionConsumerSelector.tsx \
            src/internal/transaction/adapter/next/actions.test.ts \
            src/internal/transaction/controller/transactionController.test.ts \
            src/internal/transaction/transactionConsumerSchema.test.ts

      - name: Commit and cleanup
        shell: bash
        run: |
          rm -f .github/workflows/fix-416-self-review.yml .github/workflows/fix-416-self-review-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 修正消费者提交链路与既有行为回归"
          git push origin HEAD:feature/416_transaction_consumer
