name: Verify issue 572 database

on:
  push:
    branches:
      - feature/572_refund_multi_item_allocation
    paths:
      - supabase/migrations/20260805010000_support_refund_multi_item_allocation.sql
      - supabase/tests/database/**
      - .github/workflows/issue-572-db-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 0

      - uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Run pgTAP suite
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1
