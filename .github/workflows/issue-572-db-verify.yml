name: Verify issue 572 database

on:
  push:
    branches:
      - feature/572_refund_multi_item_allocation
    paths:
      - supabase/migrations/20260805010000_support_refund_multi_item_allocation.sql
      - supabase/tests/database/**
      - .github/scripts/issue-572-db-fix.py
      - .github/workflows/issue-572-db-verify.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 0

      - name: Apply database fixes
        run: python .github/scripts/issue-572-db-fix.py

      - name: Check SQL diff
        run: git diff --check

      - uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        id: supabase_start
        continue-on-error: true
        run: supabase start > /tmp/supabase-start.log 2>&1

      - name: Publish Supabase startup failure
        if: steps.supabase_start.outcome == 'failure'
        run: |
          tail -n 300 /tmp/supabase-start.log > .github/issue-572-supabase-start.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/issue-572-supabase-start.log
          git commit -m "chore: 记录 Supabase 启动失败"
          git push origin HEAD:feature/572_refund_multi_item_allocation
          exit 1

      - name: Run pgTAP suite
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1

      - name: Commit database fixes
        if: github.event_name == 'pull_request'
        run: |
          rm -f .github/scripts/issue-572-db-fix.py \
            .github/workflows/issue-572-db-verify.yml \
            .github/issue-572-supabase-start.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 完善退款数据库兼容与目标校验"
          git push origin HEAD:feature/572_refund_multi_item_allocation
