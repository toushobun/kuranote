name: PR608 Refund Null Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pr608-refund-null-guard.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 608
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/605_pr1_release_offset_cap
          fetch-depth: 0

      - name: Patch refund-link clear guard and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration_path = Path("supabase/migrations/20260819002100_release_offset_cap_and_redefine_settlement.sql")
          migration = migration_path.read_text()

          old_declaration = """    v_special_status_enabled boolean;\n    v_has_active_reimbursement_link boolean;\n    v_is_controlled_transition boolean;\n"""
          new_declaration = """    v_special_status_enabled boolean;\n    v_has_active_refund_link boolean;\n    v_has_active_reimbursement_link boolean;\n    v_is_controlled_transition boolean;\n"""
          if migration.count(old_declaration) != 1:
              raise SystemExit("expected validator declaration block exactly once")
          migration = migration.replace(old_declaration, new_declaration, 1)

          old_guard_tail = """        if v_has_active_reimbursement_link then\n            raise exception 'reimbursement_link_exists'\n                using errcode = 'P0001', detail = 'reimbursement_link_exists';\n        end if;\n\n        return new;\n"""
          new_guard_tail = """        if v_has_active_reimbursement_link then\n            raise exception 'reimbursement_link_exists'\n                using errcode = 'P0001', detail = 'reimbursement_link_exists';\n        end if;\n\n        select exists (\n            select 1\n            from public.transaction_item_refund_link link\n            join public.transaction_item refund_income\n              on refund_income.id = link.refund_income_item_id\n             and refund_income.ledger_id = link.ledger_id\n            join public.transaction_record refund_record\n              on refund_record.id = refund_income.transaction_record_id\n             and refund_record.ledger_id = refund_income.ledger_id\n            where link.ledger_id = new.ledger_id\n              and link.refunded_item_id = new.id\n              and refund_record.status = 'active'\n        ) into v_has_active_refund_link;\n\n        if v_has_active_refund_link then\n            raise exception 'refund_link_exists'\n                using errcode = 'P0001', detail = 'refund_link_exists';\n        end if;\n\n        return new;\n"""
          if migration.count(old_guard_tail) != 1:
              raise SystemExit("expected clear-status guard tail exactly once")
          migration = migration.replace(old_guard_tail, new_guard_tail, 1)
          migration_path.write_text(migration)

          test_path = Path("supabase/tests/database/transaction_item_special_status.test.sql")
          test = test_path.read_text()
          if test.count("select plan(41);") != 1:
              raise SystemExit("expected pgTAP plan(41) exactly once")
          test = test.replace("select plan(41);", "select plan(42);", 1)

          anchor = """insert into public.transaction_item_refund_link (\n    ledger_id, refunded_item_id, refund_income_item_id,\n    refund_amount, created_by\n)\nvalues (\n    '00000000-0000-4000-8000-000000000032',\n    '59840000-0000-4000-8000-000000000005',\n    '59840000-0000-4000-8000-000000000006',\n    20,\n    '00000000-0000-4000-8000-000000000031'\n);\n\n"""
          regression = anchor + """update public.transaction_item\nset special_status = 'pending_reimbursement'\nwhere id = '59840000-0000-4000-8000-000000000005';\n\nselect set_config(\n    'request.jwt.claim.sub',\n    '00000000-0000-4000-8000-000000000031',\n    true\n);\nset local role authenticated;\n\nselect throws_ok(\n    $$\n        update public.transaction_item\n        set special_status = null\n        where id = '59840000-0000-4000-8000-000000000005'\n    $$,\n    'P0001',\n    'refund_link_exists',\n    '仅有 active 退款关联时也不能直接清空核销状态'\n);\n\nreset role;\nselect set_config('request.jwt.claim.sub', '', true);\n\n"""
          if test.count(anchor) != 1:
              raise SystemExit("expected refund-only fixture anchor exactly once")
          test = test.replace(anchor, regression, 1)
          test_path.write_text(test)
          PY

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Regenerate schema snapshot
        run: CI=1 npm run db:schema:snapshot:update

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260819002100_release_offset_cap_and_redefine_settlement.sql \
            supabase/tests/database/transaction_item_special_status.test.sql \
            supabase/schema_snapshot/current_schema.sql
          git diff --cached --quiet && { echo "no changes to commit"; exit 1; }
          git commit -m "fix: 阻止退款关联目标清空核销状态"
          git pull --rebase origin feature/605_pr1_release_offset_cap
          git push origin HEAD:feature/605_pr1_release_offset_cap
