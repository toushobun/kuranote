name: Update PR schema snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/update-pr-schema-snapshot.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Update schema snapshot
        run: npm run db:schema:snapshot:update
        env:
          CI: "1"

      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "结构快照无需更新。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
