name: PR1139 Temporary Formatter
on:
  push:
    branches:
      - feat/1139_exchange_rate_table
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1139_exchange_rate_table
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/internal/exchangeRate \
            src/internal/shared/middleware/cronAuthorization.ts \
            src/internal/shared/middleware/cronAuthorization.test.ts \
            src/internal/transaction/adapter/next/attachmentCleanupRoute.ts \
            vercel.json
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/internal/exchangeRate src/internal/shared/middleware/cronAuthorization.ts src/internal/shared/middleware/cronAuthorization.test.ts src/internal/transaction/adapter/next/attachmentCleanupRoute.ts vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'style: 规范化汇率同步代码格式'
            git push origin HEAD:feat/1139_exchange_rate_table
          fi
