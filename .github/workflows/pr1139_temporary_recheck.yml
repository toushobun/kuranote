name: PR1139 Temporary Recheck

on:
  push:
    branches:
      - feat/1139_convert_totals_to_ledger_currency

permissions:
  contents: read

env:
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

jobs:
  verify:
    name: Recheck type, lint, format, database and Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: |
          npm run type-check
          npm run lint
          npm run format:check
      - uses: supabase/setup-cli@v2
        with:
          version: 2.106.0
          github-token: ${{ github.token }}
      - run: supabase start -x "$SUPABASE_START_EXCLUDE"
      - name: Check schema snapshot
        run: npm run db:schema:snapshot:check
      - run: supabase db reset
      - name: Run database tests
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file scripts/security-definer-smoke.sql
          supabase test db
          for script in supabase/tests/database/*.sh; do
            bash "$script"
          done
      - run: npm run build-storybook

  vitest:
    name: Vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/4
