name: 临时格式化 #1134
on:
  push:
    branches:
      - feat/1134_transfer_fee

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !startsWith(github.event.head_commit.message, 'style: Prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1134_transfer_fee
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: 格式化本次改动
        run: |
          npx prettier --write \
            src/components/molecules/transactions/TransactionRow.tsx \
            src/components/organisms/transactions/TransactionItemAmountDrawer/TransactionItemAmountDrawer.tsx \
            src/components/organisms/transactions/TransferReceipt/TransferReceipt.stories.tsx \
            src/components/organisms/transactions/TransferReceipt/TransferReceipt.tsx \
            src/components/organisms/transactions/TransferReceipt/useTransferReceipt.ts \
            src/config/transactionStepFlowMessages.ts \
            src/internal/statistics/service/read/statisticsView.ts \
            src/internal/transaction/errors.ts \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/schema.test.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/service/read/options.ts \
            src/internal/transaction/service/read/transactionFormService.ts \
            src/internal/transaction/service/transactionImportService.ts \
            src/internal/transaction/service/transactionService.ts \
            src/internal/transaction/util/buildTransactionListItem.ts \
            src/types/categories.ts \
            src/utils/dataExportWorkbook.ts \
            src/internal/db-types.ts \
            src/internal/transaction/service/read/transactionReadModels.ts \
            src/types/transactions.ts
      - name: 回推仅格式化改动
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src
          if ! git diff --cached --quiet; then
            git commit -m "style: Prettier 统一格式化手续费改动"
            git push origin HEAD:refs/heads/feat/1134_transfer_fee
          fi
