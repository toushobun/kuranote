name: PR598 Autofix

on:
  push:
    branches:
      - feature/598_reimbursement_picker_and_ledger_toggle

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/598_reimbursement_picker_and_ledger_toggle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Format PR5 files
        run: |
          npx prettier --write \
            src/components/organisms/transactions/TransactionForm/TransactionForm.tsx \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.ts \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionReimbursementLinkPicker/TransactionReimbursementLinkPicker.tsx

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Update schema snapshot
        run: npm run db:schema:snapshot:update

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/organisms/transactions/TransactionForm/TransactionForm.tsx \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.ts \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionReimbursementLinkPicker/TransactionReimbursementLinkPicker.tsx \
            supabase/schema_snapshot/current_schema.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 更新格式与数据库快照"
          git push origin HEAD:feature/598_reimbursement_picker_and_ledger_toggle
