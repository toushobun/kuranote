name: Issue 1131 import final review
on:
  push:
    branches:
      - feat/1131_import_receipt_photos
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check and show source formatting
        run: |
          npx prettier src --write > /dev/null
          git diff -- src
      - run: npm run type-check
      - run: npm run lint
      - run: npx vitest run src/internal/dataImport/util/xlsxParser.test.ts src/internal/dataImport/util/validateImportWorkbook.test.ts src/internal/dataImport/util/readWorksheetPhotos.test.ts
      - run: npm test
