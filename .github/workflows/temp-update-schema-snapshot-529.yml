name: Temporary update schema snapshot for 529

on:
  push:
    branches:
      - perf/529_register_email_availability_check

permissions:
  contents: write

jobs:
  update-schema-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Update schema snapshot
        run: npm run db:schema:snapshot:update

      - name: Commit schema snapshot
        shell: bash
        run: |
          # 仅提交由 migration 回放生成的权威结构快照。
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "数据库结构快照无需更新。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
