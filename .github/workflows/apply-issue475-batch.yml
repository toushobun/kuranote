name: Apply issue 475 migration batch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'toushobun/kuranote' && github.head_ref == 'refactor/475_migrate_statistics_dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply migration batch
        shell: bash
        run: |
          set -o pipefail
          {
            set -eux
            cat .github/tmp/issue475-added.part* | base64 --decode > /tmp/issue475-added.tar.gz
            tar -xzf /tmp/issue475-added.tar.gz
            cat .github/tmp/issue475-batch.part* | base64 --decode | gunzip > /tmp/issue475.patch
            git apply --check /tmp/issue475.patch
            git apply /tmp/issue475.patch
            git checkout -- .github/workflows
            rm -f .github/tmp/issue475-added.part*
            rm -f .github/tmp/issue475-batch.part*
            rm -f apply.log
            git add -A
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "refactor: 收编废弃后端顶级结构"
            git push origin HEAD:${{ github.head_ref }}
          } 2>&1 | tee apply.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue475-apply-log
          path: apply.log
