name: PR605 Restore Form Test

on:
  push:
    branches:
      - feature/605_pr1_release_offset_cap
    paths:
      - .github/workflows/pr605-restore-form-test.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/605_pr1_release_offset_cap
          fetch-depth: 0

      - name: Restore full test file and fix zero assertion
        run: |
          git show 1b39ba38c9fe921ad587ec3fcbd2e5f610833128:src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts > src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts")
          text = path.read_text()
          old = 'expect(result.current.businessTotalAmount).toBe("+0");'
          new = 'expect(result.current.businessTotalAmount).toBe("0");'
          if text.count(old) != 1:
              raise SystemExit(f"expected one old assertion, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit restored test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts
          git commit -m "test: 恢复表单测试并修正零值断言"
          git push origin HEAD:feature/605_pr1_release_offset_cap
