name: Schema snapshot Issue 755 temp

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  update-snapshot:
    if: github.head_ref == 'feat/755_balance_adjustment_transaction_type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Read Supabase CLI version
        id: supabase_version
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Update schema snapshot
        run: npm run db:schema:snapshot:update

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "快照无变化。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 按 migrations 回放结果同步数据库结构快照"
          git push origin HEAD:${{ github.head_ref }}
