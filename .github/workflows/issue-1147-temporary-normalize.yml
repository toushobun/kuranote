# Issue #1147 临时维护流程：统一代码格式并从 migration 生成 schema snapshot；合并前删除。
name: Issue 1147 temporary normalize
on:
  push:
    branches:
      - feat/1147_cross_currency_refund_link
permissions:
  contents: write
concurrency:
  group: issue-1147-normalize
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx prettier . --write
      - uses: supabase/setup-cli@v2
        with:
          version: '2.106.0'
      - name: Generate schema snapshot from migrations
        id: snapshot
        continue-on-error: true
        env:
          CI: 'true'
        run: |
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
          npm run db:schema:snapshot:update
      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src supabase/schema_snapshot/current_schema.sql
          if ! git diff --cached --quiet; then
            git commit -m 'style: 统一跨币种代码格式并更新数据库快照'
            git push origin HEAD:feat/1147_cross_currency_refund_link
          fi
          if [ "${{ steps.snapshot.outcome }}" != "success" ]; then
            echo 'Schema snapshot generation did not succeed' >&2
            exit 1
          fi
