name: "Temporary #247: formatting and schema snapshot"
on:
  push:
    branches: [feature/247_cross_currency_transfer]
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/247_cross_currency_transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Format changed sources
        run: |
          npx prettier --write \
            src/components/molecules/transactions/TransactionRow.tsx \
            src/components/molecules/transactions/TransactionRow.test.tsx \
            src/components/molecules/transactions/TransactionRow.stories.tsx \
            src/components/organisms/transactions/TransferReceipt/transferCurrency.ts \
            src/components/organisms/transactions/TransferReceipt/transferCurrency.test.ts \
            src/components/organisms/transactions/TransferReceipt/TransferReceipt.tsx \
            src/components/organisms/transactions/TransferReceipt/TransferReceipt.test.tsx \
            src/components/organisms/transactions/TransferReceipt/TransferReceipt.stories.tsx \
            src/components/organisms/transactions/TransferReceipt/useTransferReceipt.ts \
            src/components/organisms/transactions/ReceiptParts/ReceiptAmountRow.tsx \
            src/config/transactionStepFlowMessages.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/schema.test.ts \
            src/internal/transaction/adapter/next/actions.ts \
            src/internal/transaction/controller/transactionController.ts \
            src/internal/transaction/service/transactionImportService.ts \
            src/internal/transaction/service/read/transactionFormService.ts \
            src/internal/transaction/service/read/transactionFormService.test.ts \
            src/internal/transaction/service/read/transactionReadModels.ts \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/repository/transactionRepository.test.ts \
            src/internal/transaction/util/buildTransactionListItem.ts \
            src/types/transactions.ts \
            src/internal/dataImport/schema.ts \
            src/internal/dataImport/entity/importRow.ts \
            src/internal/dataImport/errors.ts \
            src/internal/dataImport/util/parseTransferSheet.ts \
            src/internal/dataImport/util/parseTransferSheet.test.ts \
            src/internal/dataImport/service/dataImportExecutionService.ts \
            src/utils/dataExportWorkbook.ts \
            src/config/dataImportExportMessages.ts \
            src/internal/transaction/errors.ts \
            docs/security-definer-functions.md
      - name: Push formatting commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs/security-definer-functions.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: 统一跨币种转账代码格式'
            git push origin HEAD:feature/247_cross_currency_transfer
          fi
      - name: Read Supabase CLI version
        id: cli
        run: echo "version=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.cli.outputs.version }}
      - name: Start Supabase
        run: supabase start
      - name: Generate schema snapshot
        run: npm run db:schema:snapshot:update
      - name: Push schema snapshot
        run: |
          git add supabase/schema_snapshot/current_schema.sql
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 更新跨币种转账数据库结构快照'
            git push origin HEAD:feature/247_cross_currency_transfer
          fi
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
