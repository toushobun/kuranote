name: Format PR files

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/format-pr-files.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: |
          npx prettier --write \
            .github/workflows/schema-snapshot-check.yml \
            docs/security-definer-functions.md \
            package.json \
            scripts/check-security-definer-search-path.mjs \
            scripts/check-security-definer-search-path.test.mjs

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "格式无需调整。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/schema-snapshot-check.yml \
            docs/security-definer-functions.md \
            package.json \
            scripts/check-security-definer-search-path.mjs \
            scripts/check-security-definer-search-path.test.mjs
          git commit -m "chore: 格式化安全规范相关文件"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
