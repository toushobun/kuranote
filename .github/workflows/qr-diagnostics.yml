name: QR diagnostics

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format files
        run: |
          npx prettier --write \
            src/components/molecules/ledgers/LedgerInviteQrCode.test.tsx \
            src/components/molecules/ledgers/LedgerInviteQrCode.tsx \
            src/components/organisms/ledgers/LedgerInviteEntry.tsx \
            src/lib/qr/qrCode.ts
      - uses: actions/upload-artifact@v4
        with:
          name: qr-formatted-files
          path: |
            src/components/molecules/ledgers/LedgerInviteQrCode.test.tsx
            src/components/molecules/ledgers/LedgerInviteQrCode.tsx
            src/components/organisms/ledgers/LedgerInviteEntry.tsx
            src/lib/qr/qrCode.ts
