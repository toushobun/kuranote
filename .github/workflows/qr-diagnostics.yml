name: QR diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch ledger name integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/templates/ledgers/LedgerSettings.tsx")
          content = path.read_text(encoding="utf-8")
          before = """                  ledgerId={ledger.id}\n                  token={inviteToken}\n"""
          after = """                  ledgerId={ledger.id}\n                  ledgerName={ledger.name}\n                  token={inviteToken}\n"""
          if before not in content:
              raise SystemExit("未找到 LedgerInviteEntry 调用位置")
          path.write_text(content.replace(before, after, 1), encoding="utf-8")
          PY
          npx prettier --write src/components/templates/ledgers/LedgerSettings.tsx
      - name: Commit integration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/templates/ledgers/LedgerSettings.tsx
          git commit -m "feat: 传递邀请二维码账本名称"
          git push origin HEAD:${{ github.head_ref }}
