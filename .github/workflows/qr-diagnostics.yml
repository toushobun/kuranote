name: QR diagnostics

on:
  pull_request:
    branches:
      - main

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Collect diagnostics
        run: |
          {
            echo "## TypeScript"
            npx tsc --noEmit --pretty false 2>&1 || true
            echo
            echo "## Prettier"
            npx prettier . --list-different 2>&1 || true
          } > diagnostics.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qr-diagnostics
          path: diagnostics.txt
