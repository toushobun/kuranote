name: QR diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format files
        run: |
          npx prettier --write \
            src/components/molecules/ledgers/LedgerInviteQrCode.test.tsx \
            src/components/molecules/ledgers/LedgerInviteQrCode.tsx \
            src/components/organisms/ledgers/LedgerInviteEntry.tsx \
            src/lib/qr/qrCode.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/molecules/ledgers/LedgerInviteQrCode.test.tsx \
            src/components/molecules/ledgers/LedgerInviteQrCode.tsx \
            src/components/organisms/ledgers/LedgerInviteEntry.tsx \
            src/lib/qr/qrCode.ts
          git commit -m "style: 格式化二维码实现"
          git push origin HEAD:${{ github.head_ref }}
