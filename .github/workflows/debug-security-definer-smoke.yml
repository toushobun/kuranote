name: Debug SECURITY DEFINER smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/debug-security-definer-smoke.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Capture smoke output
        shell: bash
        run: |
          set +e
          psql \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file scripts/security-definer-smoke.sql \
            >/tmp/security-definer-smoke.log 2>&1
          status=$?
          echo "${status}" >/tmp/security-definer-smoke-exit-code
          cat /tmp/security-definer-smoke.log
          exit 0

      - name: Upload smoke output
        uses: actions/upload-artifact@v4
        with:
          name: security-definer-smoke-output
          path: |
            /tmp/security-definer-smoke.log
            /tmp/security-definer-smoke-exit-code
          retention-days: 1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
