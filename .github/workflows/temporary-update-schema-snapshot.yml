name: Temporary update schema snapshot

on:
  push:
    branches:
      - fix/695_merchant_preferred_alias_race

permissions:
  contents: write

jobs:
  update-schema-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/695_merchant_preferred_alias_race
      - uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: Start Supabase
        run: supabase start
      - name: Update schema snapshot
        run: CI=1 npm run db:schema:snapshot:update
      - name: Commit schema snapshot
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin HEAD:fix/695_merchant_preferred_alias_race
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
