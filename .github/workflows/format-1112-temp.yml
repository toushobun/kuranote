# 临时格式化工作流。#1112 PR 分支仅短期使用，格式化后删除。
name: Issue 1112 temporary formatter
on:
  push:
    branches:
      - feat/1112_candidate_month_partial
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1112_candidate_month_partial
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Format touched source
        run: |
          npx prettier --write \
            src/components/molecules/transactions/TransactionDateTimePicker/MonthPicker.tsx \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionLinkCandidatePanel \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/util/transactionLinkCandidates.test.ts \
            src/internal/transaction/util/transactionLinkCandidates.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: 统一候选月份与分组代码格式"
          git push origin HEAD:feat/1112_candidate_month_partial
