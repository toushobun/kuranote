name: Export PR source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/export-pr-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export source
        uses: actions/upload-artifact@v4
        with:
          name: pr-source
          path: .
          include-hidden-files: true
          retention-days: 1
