name: CI

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  refactor:
    name: Apply issue 500 refactor
    if: github.event.pull_request.head.ref == 'refactor/500_internal_router_table'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore normal CI
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Apply refactor
        run: node scripts/refactor-issue-500.mjs

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npm run format

      - name: Commit refactor
        shell: bash
        run: |
          rm -f scripts/refactor-issue-500.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: 迁移 internal 目录并显式化路由契约'
          git push origin HEAD:${{ github.head_ref }}
