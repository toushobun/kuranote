name: CI

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  refactor:
    name: Apply issue 500 refactor
    if: github.event.pull_request.head.ref == 'refactor/500_internal_router_table'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Skip completed migration
        id: migration-state
        shell: bash
        run: |
          if [ -f scripts/refactor-issue-500.mjs ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply refactor
        if: steps.migration-state.outputs.run == 'true'
        run: node scripts/refactor-issue-500.mjs

      - name: Install dependencies
        if: steps.migration-state.outputs.run == 'true'
        run: npm ci

      - name: Format changed files
        if: steps.migration-state.outputs.run == 'true'
        run: npm run format

      - name: Restore bootstrap workflow
        if: steps.migration-state.outputs.run == 'true'
        run: git checkout HEAD -- .github/workflows/ci.yml

      - name: Commit refactor
        if: steps.migration-state.outputs.run == 'true'
        shell: bash
        run: |
          rm -f scripts/refactor-issue-500.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'refactor: 迁移 internal 目录并显式化路由契约'
          git push origin HEAD:${{ github.head_ref }}
