name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  RUN_CODE_CI: &run_code_ci >-
    github.event_name != 'pull_request' ||
    startsWith(github.head_ref, 'docs/') == false

jobs:
  apply-account-boundary-fixes:
    if: github.event.pull_request.head.ref == 'feature/551_transaction_item_special_status'
    name: Apply account boundary fixes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text()
              if old not in content:
                  raise SystemExit(f"replacement anchor not found: {path}")
              target.write_text(content.replace(old, new, 1))

          replace(
              "src/types/transactions.ts",
              "  account_id: string;\n  account_name: string;",
              "  account_id?: string;\n  account_name: string;",
          )
          replace(
              "src/components/organisms/transactions/TransactionGroupList/TransactionGroupList.tsx",
              '      if (item.categoryType !== "expense" || !item.id) return [];',
              '''      if (
        item.categoryType !== "expense" ||
        !item.id ||
        !record.account_id
      )
        return [];''',
          )
          replace(
              "src/internal/transaction/repository/transactionRepository.ts",
              '  | "amount"\n  | "category_id"',
              '  | "amount"\n  | "category_id"\n  | "id"',
          )
          replace(
              "src/internal/transaction/repository/transactionRepository.ts",
              '  | "settled_by_item_id"\n  | "transaction_record_id"',
              '  | "settled_by_item_id"\n  | "special_status"\n  | "transaction_record_id"',
          )
          replace(
              "src/components/organisms/transactions/TransactionForm/useTransactionForm.ts",
              '''    setPickerRefundCandidate: (
      candidate: TransactionRefundCandidate | null,
    ) => {
      setPickerRefundCandidate(candidate);
      if (candidate) setPickerReimbursementItemIds([]);
      setLinkNotice(null);
    },''',
              '''    setPickerRefundCandidate: (
      candidate: TransactionRefundCandidate | null,
    ) => {
      if (candidate && candidate.accountId !== selectedAccountId) {
        setPickerRefundCandidate(null);
        setLinkNotice("退款明细必须与收款账户一致，请重新选择。");
        return;
      }
      setPickerRefundCandidate(candidate);
      if (candidate) setPickerReimbursementItemIds([]);
      setLinkNotice(null);
    },''',
          )
          PY

      - name: Restore workflows and commit fixes
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show origin/main:.github/workflows/migration-check.yml > .github/workflows/migration-check.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 收窄退款候选账户字段边界'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  # Stage 1: 并行静态检查
  type-check:
    name: Type check
    if: *run_code_ci
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  format-check:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    if: *run_code_ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint

  # Stage 2: 依赖 Stage 1，单一 job 内先跑快速测试，再按需跑 RSC 测试
  test:
    name: Test
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      startsWith(github.head_ref, 'docs/') == false)
    needs: [format-check, type-check, lint]
    runs-on: ubuntu-latest

    steps:
      - name: Verify prerequisite checks
        env:
          FORMAT_CHECK_RESULT: ${{ needs['format-check'].result }}
          TYPE_CHECK_RESULT: ${{ needs['type-check'].result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          if [ "$FORMAT_CHECK_RESULT" != "success" ] || \
             [ "$TYPE_CHECK_RESULT" != "success" ] || \
             [ "$LINT_RESULT" != "success" ]; then
            echo "Format check: $FORMAT_CHECK_RESULT"
            echo "Type check: $TYPE_CHECK_RESULT"
            echo "Lint: $LINT_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Check RSC test scope
        id: rsc-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            src/internal/shared/context/createServerRequestDependencies.ts \
            tests/rsc \
            package.json \
            package-lock.json; then
            echo "run_rsc=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_rsc=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RSC tests
        if: steps.rsc-scope.outputs.run_rsc == 'true'
        run: npm run test:rsc

  # Stage 3: build 和 storybook-build 并行，只等待测试完成
  build:
    name: Build
    if: *run_code_ci
    needs: [test]
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run build
        run: npm run build

  storybook-build:
    name: Storybook build
    if: *run_code_ci
    needs: [test]
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook
