name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

env:
  RUN_CODE_CI: &run_code_ci >-
    github.event_name != 'pull_request' ||
    startsWith(github.head_ref, 'docs/') == false
  # DB 检查只需要 Postgres、Auth、Storage 等表结构来源，不启动与测试无关的服务以缩短 supabase start。
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

# 同一 PR 推送新提交时取消仍在运行的旧 CI，只保留最新一次的结果。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 所有检查同时开始、互不等待；合并前仍需全部必需检查通过。
  type-check:
    name: Type check
    if: *run_code_ci
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

  format-check:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  lint:
    name: Lint
    if: *run_code_ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run lint
        run: npm run lint

  # vitest 按文件分成 4 片并行；RSC 测试只在第 1 片按需执行。
  test-shard:
    name: Test (shard ${{ matrix.shard }}/4)
    if: *run_code_ci
    runs-on: ubuntu-latest
    strategy:
      # 某一片失败时其余分片继续跑完，一次看到全部失败用例。
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests
        run: npm run test -- --shard=${{ matrix.shard }}/4

      - name: Check RSC test scope
        if: matrix.shard == 1
        id: rsc-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            src/internal/shared/context/createServerRequestDependencies.ts \
            tests/rsc \
            package.json \
            package-lock.json; then
            echo "run_rsc=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_rsc=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run RSC tests
        if: steps.rsc-scope.outputs.run_rsc == 'true'
        run: npm run test:rsc

  # 仓库规则的必需检查名为「Test」，由此 job 汇总全部分片结果。
  test:
    name: Test
    if: always() && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'docs/') == false)
    needs: [test-shard]
    runs-on: ubuntu-latest

    steps:
      - name: Verify all test shards passed
        env:
          TEST_SHARD_RESULT: ${{ needs['test-shard'].result }}
        run: |
          if [ "$TEST_SHARD_RESULT" != "success" ]; then
            echo "Test shards: $TEST_SHARD_RESULT"
            exit 1
          fi

  schema-snapshot-check:
    name: Schema snapshot check
    if: *run_code_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check schema snapshot scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            supabase/migrations \
            supabase/schema_snapshot \
            supabase/config.toml \
            scripts/generate-schema-snapshot.sh \
            scripts/update-schema-snapshot.sh \
            scripts/check-schema-snapshot.sh \
            scripts/check-security-definer-search-path.mjs \
            scripts/check-security-definer-search-path-cases.mjs \
            scripts/security-definer-smoke.sql \
            scripts/security-definer-smoke-issue-598.sql \
            scripts/security-definer-smoke-issue-395.sql \
            .supabase-version \
            package.json \
            .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check maintenance scripts
        if: steps.scope.outputs.run == 'true'
        run: |
          bash -n scripts/generate-schema-snapshot.sh
          bash -n scripts/update-schema-snapshot.sh
          bash -n scripts/check-schema-snapshot.sh
          shellcheck \
            scripts/generate-schema-snapshot.sh \
            scripts/update-schema-snapshot.sh \
            scripts/check-schema-snapshot.sh
          node --check scripts/check-security-definer-search-path.mjs
          npm run db:security-definer:test
          npm run db:security-definer:check

      - name: Check migration-first configuration
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if ! grep -Eq '^[[:space:]]*schema_paths[[:space:]]*=[[:space:]]*\[[[:space:]]*\][[:space:]]*$' supabase/config.toml; then
            echo "supabase/config.toml 的 schema_paths 必须保持为空，结构快照不得参与 migration 生成。" >&2
            exit 1
          fi

      - name: Check migration history is append-only
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          changed_migrations="$(git diff --name-only --diff-filter=MDR \
            "${{ github.event.pull_request.base.sha }}...HEAD" -- supabase/migrations/)"
          if [[ -n "${changed_migrations}" ]]; then
            echo "已经合入 main 的 migration 不允许修改、删除或重命名：" >&2
            echo "${changed_migrations}" >&2
            echo "请新增向前 migration 表达数据库变更。" >&2
            exit 1
          fi

      - name: Read Supabase CLI version
        if: steps.scope.outputs.run == 'true'
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".supabase-version 内容异常，应为形如 2.106.0 的版本号。" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        if: steps.scope.outputs.run == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        run: supabase start -x "${SUPABASE_START_EXCLUDE}"

      - name: Compare migrations with schema snapshot
        if: steps.scope.outputs.run == 'true'
        run: npm run db:schema:snapshot:check
        env:
          ACTUAL_SCHEMA_SNAPSHOT_PATH: /tmp/kuranote-current-schema.sql

      - name: Smoke test SECURITY DEFINER RPC
        if: steps.scope.outputs.run == 'true'
        run: |
          psql \
            "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set ON_ERROR_STOP=1 \
            --file scripts/security-definer-smoke.sql

      - name: Upload generated snapshot
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: current-schema-snapshot
          path: /tmp/kuranote-current-schema.sql
          if-no-files-found: ignore

  migration-check:
    name: Migration check
    if: *run_code_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration check scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            supabase/migrations \
            supabase/tests/database \
            supabase/seed.sql \
            supabase/seeds \
            supabase/config.toml \
            .supabase-version \
            .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read Supabase CLI version
        if: steps.scope.outputs.run == 'true'
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo ".supabase-version 内容异常，应为形如 2.106.0 的版本号。" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Check SECURITY DEFINER search_path
        if: steps.scope.outputs.run == 'true'
        run: npm run db:security-definer:check

      - name: Setup Supabase CLI
        if: steps.scope.outputs.run == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if ! supabase start -x "${SUPABASE_START_EXCLUDE}" > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Run database tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          supabase test db
          bash supabase/tests/database/category_reorder_concurrency.sh
          bash supabase/tests/database/category_reorder_write_concurrency.sh
          bash supabase/tests/database/refund_allocation_concurrency.sh
          bash supabase/tests/database/issue_574_pr1_concurrency.sh
          bash supabase/tests/database/issue_944_link_retarget_concurrency.sh
          bash supabase/tests/database/transaction_payment_account_lock_concurrency.sh
          bash supabase/tests/database/account_currency_lock_concurrency.sh

      - name: Check required configuration
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "SUPABASE_DB_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "SUPABASE_PROJECT_REF is not set."
            exit 1
          fi

      - name: Link Supabase project
        if: steps.scope.outputs.run == 'true'
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Check migrations dry run
        if: steps.scope.outputs.run == 'true'
        run: supabase db push --dry-run

  build:
    name: Build
    if: *run_code_ci
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run build
        run: npm run build

  storybook-build:
    name: Storybook build
    if: *run_code_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  storybook-preview:
    name: Storybook preview
    if: *run_code_ci
    needs: [storybook-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # 同一 PR 的发布与清理串行；不同 PR 不互相取消排队作业。
    concurrency:
      group: gh-pages-storybook-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Check PR is still open
        id: pr-state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.state')"
          if [ "$state" = "open" ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "PR is no longer open; skip stale Storybook preview deployment."
          fi

      - name: Deploy Storybook preview
        if: steps.pr-state.outputs.open == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment Storybook preview link
        if: steps.pr-state.outputs.open == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: storybook-preview
          message: |
            📖 Storybook 预览：https://toushobun.github.io/kuranote/pr-${{ github.event.pull_request.number }}/

            （静态预览，组件使用 mock 数据渲染，不连接生产 Supabase；链接公开可访问，请勿在 story 中放入真实数据。）
