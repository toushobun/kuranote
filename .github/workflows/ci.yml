name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  inventory:
    name: Generate issue 500 inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Generate inventory
        shell: bash
        run: |
          {
            echo '=== FILES ==='
            find src/server -type f | sort
            echo
            echo '=== ROUTERS ==='
            while IFS= read -r file; do
              echo
              echo "===== $file ====="
              cat "$file"
            done < <(find src/server -name router.ts -type f | sort)
            echo
            echo '=== CONTROLLERS ==='
            while IFS= read -r file; do
              echo
              echo "===== $file ====="
              cat "$file"
            done < <(find src/server -path '*/controller/*.ts' -type f | sort)
            echo
            echo '=== CONFIG AND RULES ==='
            for file in tsconfig.json vitest.config.ts eslint.config.mjs AGENTS.md docs/AI_RULES.md tests/rsc/createServerRequestDependencies.rsc.test.ts; do
              if [ -f "$file" ]; then
                echo
                echo "===== $file ====="
                cat "$file"
              fi
            done
          } > issue-500-inventory.txt

      - name: Restore CI and commit inventory
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/issue-500-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml .github/workflows/issue-500-bootstrap.yml issue-500-inventory.txt
          git commit -m 'chore: 生成架构重构清单结果'
          git push origin HEAD:${{ github.head_ref }}
