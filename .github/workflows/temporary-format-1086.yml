name: Temporary #1086 formatting
on:
  push:
    branches:
      - feat/1086_refund_amount_and_settled_state
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1086_refund_amount_and_settled_state
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Format changed source and remove temporary workflow
        shell: bash
        run: |
          npx prettier --write \
            src/components/organisms/transactions/TransactionForm/TransactionForm.utils.ts \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.ts \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.test.tsx \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.stories.tsx \
            src/components/organisms/transactions/TransactionLinkCandidateCards/TransactionLinkCandidateCards.tsx \
            src/components/organisms/transactions/TransactionLinkCandidateCards/TransactionLinkCandidateCards.test.tsx \
            src/components/organisms/transactions/TransactionLinkCandidatePanel/TransactionLinkCandidatePanel.tsx \
            src/components/organisms/transactions/TransactionLinkCandidatePanel/TransactionLinkCandidatePanel.stories.tsx \
            src/components/organisms/transactions/TransactionLinkCandidatePanel/transactionLinkCandidateFixtures.ts \
            src/components/organisms/transactions/TransactionStepItemPicker/TransactionStepItemPicker.tsx \
            src/config/transactionStepFlowMessages.ts \
            src/internal/transaction/index.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/schema.test.ts \
            src/internal/transaction/errors.ts \
            src/internal/transaction/service/transactionService.ts \
            src/internal/transaction/service/transactionService.test.ts \
            src/internal/transaction/service/read/transactionFormService.ts \
            src/internal/transaction/service/read/transactionFormService.test.ts \
            src/internal/transaction/util/transactionLinkCandidates.ts \
            src/internal/transaction/util/transactionLinkCandidates.test.ts
          rm .github/workflows/temporary-format-1086.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: 自动规范化退款报销代码格式"
            git push origin HEAD:feat/1086_refund_amount_and_settled_state
          fi
