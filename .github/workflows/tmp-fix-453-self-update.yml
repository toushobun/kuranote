name: Temporary fix 453 self update

on:
  push:
    branches:
      - fix/453_restore_ledger_invite_link

permissions:
  contents: write

jobs:
  self-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/453_restore_ledger_invite_link
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore generated schema snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8366702604/zip \
            --output /tmp/current-schema-snapshot.zip
          unzip -p /tmp/current-schema-snapshot.zip kuranote-current-schema.sql \
            > supabase/schema_snapshot/current_schema.sql

      - name: Format repository
        run: npm run format

      - name: Commit generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/invite/[token]/page.test.tsx \
            app/invite/[token]/page.tsx \
            'app/(protected)/ledgers/[ledgerId]/settings/page.tsx' \
            src/components/organisms/ledgers/LedgerInviteEntry.stories.tsx \
            src/components/organisms/ledgers/LedgerInviteEntry.test.tsx \
            src/components/organisms/ledgers/LedgerInviteEntry.tsx \
            src/components/organisms/ledgers/LedgerInvitePending.test.tsx \
            src/components/organisms/ledgers/useLedgerInviteEntry.ts \
            src/config/paths.test.ts \
            src/config/paths.ts \
            src/server/actions/ledgerInvite.test.ts \
            src/server/actions/ledgerInvite.ts \
            src/server/db/ledgerInviteRecoverableTokenMigration.test.ts \
            src/server/services/ledgerInvite.test.ts \
            src/server/services/ledgerInvite.ts \
            src/server/services/ledgerInviteManagement.test.ts \
            src/types/ledgers.ts \
            supabase/schema_snapshot/current_schema.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 更新邀请修复格式与结构快照"
          git push origin HEAD:fix/453_restore_ledger_invite_link
