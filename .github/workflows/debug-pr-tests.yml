name: Debug PR tests

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/debug-pr-tests.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test > /tmp/test-output.log 2>&1
          status=$?
          tail -n 300 /tmp/test-output.log
          echo "${status}" >/tmp/test-exit-code
          exit 0

      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-output
          path: |
            /tmp/test-output.log
            /tmp/test-exit-code
          retention-days: 1
