name: Issue 1098 one-off formatting and snapshot
on:
  push:
    branches: [fix/1098_refund_candidate_merchant_first]
    paths: [.github/workflows/issue-1098-oneoff.yml]
permissions:
  contents: write
jobs:
  update-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1098_refund_candidate_merchant_first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Format changes
        run: |
          npx prettier --write \
            src/components/molecules/ui/LoadMoreOnVisible/LoadMoreOnVisible.tsx \
            src/components/molecules/ui/LoadMoreOnVisible/LoadMoreOnVisible.test.tsx \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/repository/transactionRepository.test.ts \
            src/internal/transaction/service/transactionService.test.ts \
            src/internal/transaction/service/transactionExportQueryService.test.ts
      - name: Read Supabase version
        id: version
        run: echo "version=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.version.outputs.version }}
      - name: Start DB
        run: supabase start
      - name: Update generated schema
        run: CI=1 npm run db:schema:snapshot:update
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/molecules/ui/LoadMoreOnVisible/LoadMoreOnVisible.tsx \
            src/components/molecules/ui/LoadMoreOnVisible/LoadMoreOnVisible.test.tsx \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/repository/transactionRepository.test.ts \
            src/internal/transaction/service/transactionService.test.ts \
            src/internal/transaction/service/transactionExportQueryService.test.ts \
            supabase/schema_snapshot/current_schema.sql
          if ! git diff --cached --quiet; then
            git commit -m "style: 更新分页代码格式与数据库快照"
            git fetch origin fix/1098_refund_candidate_merchant_first
            git rebase origin/fix/1098_refund_candidate_merchant_first
            git push origin HEAD:fix/1098_refund_candidate_merchant_first
          fi
