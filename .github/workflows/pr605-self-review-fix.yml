name: PR605 Self Review Fix

on:
  push:
    branches:
      - feature/605_pr1_release_offset_cap
    paths:
      - .github/workflows/pr605-self-review-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/605_pr1_release_offset_cap
          fetch-depth: 0

      - name: Widen signed remaining amount variables
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260819002100_release_offset_cap_and_redefine_settlement.sql")
          text = path.read_text(encoding="utf-8")
          old = "    v_remaining_amount numeric(14,2);"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"expected 2 declarations, got {count}")
          path.write_text(text.replace(old, "    v_remaining_amount numeric;"), encoding="utf-8")
          PY

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Regenerate schema snapshot
        run: CI=1 npm run db:schema:snapshot:update

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20260819002100_release_offset_cap_and_redefine_settlement.sql \
            supabase/schema_snapshot/current_schema.sql
          git diff --cached --quiet && { echo "no changes"; exit 1; }
          git commit -m "fix: 放宽核销状态计算数值范围"
          git push origin HEAD:feature/605_pr1_release_offset_cap
