name: Issue 550 Extension Path Fix And Verify

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    name: Fix extension search path and verify implementation
    if: github.head_ref == 'feature/550_remove_transaction_tag'
    runs-on: ubuntu-latest

    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/550_remove_transaction_tag
          fetch-depth: 0

      - name: Fix extension search path and regression test
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20260731020336_remove_transaction_tags.sql")
          sql = migration.read_text()
          old = "security definer\nset search_path = pg_catalog, pg_temp\nas $$\ndeclare\n    v_root record;"
          new = "security definer\nset search_path = pg_catalog, extensions, pg_temp\nas $$\ndeclare\n    v_root record;"
          if sql.count(old) != 1:
              raise SystemExit(f"expected one initialize_ledger_default_data search_path target, found {sql.count(old)}")
          migration.write_text(sql.replace(old, new, 1))

          test = Path("src/internal/transaction/repository/transactionRpcMigration.test.ts")
          text = test.read_text()
          old = '"set search_path = pg_catalog, pg_temp",'
          new = '"set search_path = pg_catalog, extensions, pg_temp",'
          if text.count(old) != 1:
              raise SystemExit(f"expected one search_path assertion target, found {text.count(old)}")
          test.write_text(text.replace(old, new, 1))
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Setup PostgreSQL 17 client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "${GITHUB_PATH}"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Start local Supabase
        run: supabase start

      - name: Replay all migrations from scratch
        run: supabase db reset --local --no-seed

      - name: Format
        run: npm run format

      - name: Update database schema snapshot
        run: npm run db:schema:snapshot:update

      - name: Check SECURITY DEFINER search_path
        run: npm run db:security-definer:check

      - name: Run SECURITY DEFINER smoke test
        shell: bash
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            --set=ON_ERROR_STOP=1 \
            --file=scripts/security-definer-smoke.sql

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Check database schema snapshot
        run: npm run db:schema:snapshot:check

      - name: Verify scope and migration history
        shell: bash
        run: |
          rm .github/workflows/issue-550-extension-path-fix.yml
          git diff --name-status origin/main -- supabase/migrations/ | tee /tmp/migration-status.txt
          if grep -Ev '^A[[:space:]]' /tmp/migration-status.txt | grep -q .; then
            echo "历史 migration 被修改、删除或重命名。" >&2
            exit 1
          fi
          if git diff --name-only origin/main -- | grep -q 'TransactionBusinessBadge'; then
            echo "TransactionBusinessBadge 超出 #550 范围。" >&2
            exit 1
          fi
          test ! -e .github/workflows/issue-550-extension-path-fix.yml
          git diff --check

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1 || true

      - name: Commit and push fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 补充账本初始化函数扩展路径"
          git push origin HEAD:feature/550_remove_transaction_tag
