name: Issue 1131 second-pass review
on:
  push:
    branches:
      - feat/1131_import_receipt_photos
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npx prettier src --check
      - run: npx vitest run src/components/templates/settings/useDataImportForm.test.ts src/internal/dataImport/util/readWorksheetPhotos.test.ts src/utils/dataImportPhotoBatch.test.ts
      - run: npm test
