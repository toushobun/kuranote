name: Issue 500 boundary diagnostic

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'refactor/500_internal_router_table'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Run boundary test
        shell: bash
        run: |
          set +e
          npx vitest run src/internal/internalBoundary.test.ts --reporter=dot > /tmp/boundary.log 2>&1
          status=$?
          grep -E '绕过模块入口|反向依赖|定义 createRoute|AssertionError|FAIL|×' /tmp/boundary.log || tail -n 30 /tmp/boundary.log
          exit "$status"
