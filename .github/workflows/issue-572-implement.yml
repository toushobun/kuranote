name: Implement issue 572

on:
  push:
    branches:
      - feature/572_refund_multi_item_allocation
    paths:
      - .github/scripts/issue-572-implement.py
      - .github/workflows/issue-572-implement.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare transformation script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issue-572-implement.py')
          text = path.read_text()
          text = text.replace('if count < minimum:', 'if count == 0:')
          text = text.replace(
              'replace_all(path, "= null,", "= [],", minimum=1)',
              'replace_once(path, "  pickerRefundCandidates = null,\\n", "  pickerRefundCandidates = [],\\n")',
          )
          text = text.replace(
              '''replace_once(
              path,
              "      if (ids.length > 0) setPickerRefundCandidates(null);\\n",
              "      if (ids.length > 0) setPickerRefundCandidates([]);\\n",
          )
          ''',
              '',
          )
          marker = '# ---------------------------------------------------------------------------\n# 单元测试的现有夹具 API 迁移'
          if marker in text:
              text = text[:text.index(marker)] + 'print("Issue #572 source transformations completed")\n'
          path.write_text(text)
          PY

      - name: Apply implementation
        run: python .github/scripts/issue-572-implement.py

      - name: Fix generated compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def patch(path: str, transform) -> None:
              target = Path(path)
              target.write_text(transform(target.read_text()))

          patch(
              'src/internal/transaction/util/refundAllocation.ts',
              lambda text: re.sub(r'(?<![A-Za-z0-9_])(\d+)n', r'BigInt(\1)', text),
          )

          patch(
              'src/components/organisms/transactions/TransactionForm/useTransactionForm.ts',
              lambda text: text.replace(
                  'item.refundCandidates ?? null',
                  'item.refundCandidates ?? []',
              ),
          )

          def update_hook_test(text: str) -> str:
              text = text.replace('setPickerRefundCandidate', 'setPickerRefundCandidates')
              text = text.replace('pickerRefundCandidate', 'pickerRefundCandidates')
              text = text.replace(
                  'setPickerRefundCandidates(refundCandidate)',
                  'setPickerRefundCandidates([refundCandidate])',
              )
              text = re.sub(
                  r'''result\.current\.setPickerRefundCandidates\(\{\s+
                  \.\.\.refundCandidate,\s+
                  accountId:\s*"account-2",\s+
                  \}\)''',
                  '''result.current.setPickerRefundCandidates([
                    {
                      ...refundCandidate,
                      accountId: "account-2",
                    },
                  ])''',
                  text,
                  flags=re.VERBOSE,
              )
              text = text.replace(
                  'expect(result.current.pickerRefundCandidates).toEqual(refundCandidate);',
                  'expect(result.current.pickerRefundCandidates).toEqual([refundCandidate]);',
              )
              text = text.replace(
                  'expect(result.current.pickerRefundCandidates).toBeNull();',
                  'expect(result.current.pickerRefundCandidates).toEqual([]);',
              )
              return text

          patch(
              'src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts',
              update_hook_test,
          )

          def update_picker(text: str) -> str:
              text = text.replace(
                  'import { useMemo, useState } from "react";',
                  'import { useState } from "react";',
              )
              text = text.replace('  refundAmount: string;', '  refundAmount?: string;')
              text = text.replace(
                  '  value: TransactionRefundCandidate[];',
                  '  value?: TransactionRefundCandidate[] | null;',
              )
              text = text.replace('  refundAmount,\n', '  refundAmount = "0",\n')
              text = text.replace(
                  '}: TransactionRefundLinkPickerProps) {\n',
                  '}: TransactionRefundLinkPickerProps) {\n  const selectedValue = value ?? [];\n',
              )
              text = re.sub(
                  r'  const allocations = useMemo\(\n    \(\) => allocateRefundAmount\(refundAmount, value\),\n    \[refundAmount, value\],\n  \);',
                  '  const allocations = allocateRefundAmount(refundAmount, selectedValue);',
                  text,
              )
              text = text.replace('setDraftValue(value);', 'setDraftValue(selectedValue);')
              text = text.replace('value.length', 'selectedValue.length')
              text = text.replace('value.map', 'selectedValue.map')
              return text

          patch(
              'src/components/organisms/transactions/TransactionRefundLinkPicker/TransactionRefundLinkPicker.tsx',
              update_picker,
          )

          def update_picker_test(text: str) -> str:
              text = text.replace(
                  '''fireEvent.click(screen.getByRole("button", { name: "选择退款明细 午餐" }));
              expect(onChange).toHaveBeenCalledWith(
                expect.objectContaining({
                  id: "refund-item-1",
                  remainingRefundableAmount: "1000",
                }),
              );''',
                  '''fireEvent.click(screen.getByRole("button", { name: "选择退款明细 午餐" }));
              fireEvent.click(screen.getByRole("button", { name: "完成（1）" }));
              expect(onChange).toHaveBeenCalledWith([
                expect.objectContaining({
                  id: "refund-item-1",
                  remainingRefundableAmount: "1000",
                }),
              ]);''',
              )
              return text

          patch(
              'src/components/organisms/transactions/TransactionRefundLinkPicker/TransactionRefundLinkPicker.test.tsx',
              update_picker_test,
          )

          def update_service_test(text: str) -> str:
              return text.replace(
                  'refundedItemId: "00000000-0000-4000-8000-000000005073",',
                  '''refundAllocations: [
                    {
                      refundAmount: 1200,
                      refundedItemId: "00000000-0000-4000-8000-000000005073",
                    },
                  ],''',
              )

          patch(
              'src/internal/transaction/service/transactionService.test.ts',
              update_service_test,
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format generated changes
        run: npx prettier --write src supabase/migrations/20260805010000_support_refund_multi_item_allocation.sql

      - name: Check generated diff
        run: git diff --check

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - name: Commit implementation
        if: github.event_name == 'pull_request'
        run: |
          rm -f .github/scripts/issue-572-implement.py .github/workflows/issue-572-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 支持退款多明细按比例分摊"
          git push origin HEAD:feature/572_refund_multi_item_allocation
