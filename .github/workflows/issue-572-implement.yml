name: Implement issue 572

on:
  push:
    branches:
      - feature/572_refund_multi_item_allocation
    paths:
      - .github/scripts/issue-572-implement.py
      - .github/scripts/issue-572-compat.py
      - .github/scripts/issue-572-test-compat.py
      - .github/workflows/issue-572-implement.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare transformation script
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/issue-572-implement.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('if count < minimum:', 'if count == 0:')
          text = text.replace(
              'replace_all(path, "= null,", "= [],", minimum=1)',
              'replace_once(path, "  pickerRefundCandidates = null,\\n", "  pickerRefundCandidates = [],\\n")',
          )
          text = text.replace(
              '''replace_once(
              path,
              "      if (ids.length > 0) setPickerRefundCandidates(null);\\n",
              "      if (ids.length > 0) setPickerRefundCandidates([]);\\n",
          )
          ''',
              '',
          )
          marker = '# ---------------------------------------------------------------------------\n# 单元测试的现有夹具 API 迁移'
          if marker in text:
              text = text[:text.index(marker)] + 'print("Issue #572 source transformations completed")\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply implementation
        run: python .github/scripts/issue-572-implement.py

      - name: Apply compatibility migrations
        run: python .github/scripts/issue-572-compat.py

      - name: Install dependencies
        run: npm ci

      - name: Format generated changes
        run: npx prettier --write src supabase/migrations/20260805010000_support_refund_multi_item_allocation.sql

      - name: Check generated diff
        run: git diff --check

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: npm run test -- --run --reporter=json --outputFile=.github/issue-572-vitest.json

      - name: Publish unit test failure summary
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('.github/issue-572-vitest.json').read_text())
          lines = []
          for suite in report.get('testResults', []):
              failed = [
                  assertion
                  for assertion in suite.get('assertionResults', [])
                  if assertion.get('status') == 'failed'
              ]
              if not failed:
                  continue
              lines.append(suite.get('name', '<unknown suite>'))
              for assertion in failed:
                  title = ' > '.join(
                      [*assertion.get('ancestorTitles', []), assertion.get('title', '')]
                  )
                  lines.append(f'- {title}')
                  for message in assertion.get('failureMessages', []):
                      lines.append(message[:4000])
          Path('.github/issue-572-vitest-summary.txt').write_text(
              '\n\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          Path('.github/issue-572-vitest.json').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/issue-572-vitest-summary.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: 记录退款多选测试失败"
            git push origin HEAD:feature/572_refund_multi_item_allocation
          fi
          exit 1

      - name: Build
        run: npm run build

      - name: Commit implementation
        if: github.event_name == 'pull_request'
        run: |
          rm -f .github/scripts/issue-572-implement.py \
            .github/scripts/issue-572-compat.py \
            .github/scripts/issue-572-test-compat.py \
            .github/workflows/issue-572-implement.yml \
            .github/issue-572-vitest-summary.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: 支持退款多明细按比例分摊"
          git push origin HEAD:feature/572_refund_multi_item_allocation
