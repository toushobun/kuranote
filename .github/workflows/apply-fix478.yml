name: Apply PR 478 fixes

on:
  push:
    branches:
      - refactor/472_ledger_auth_user
    paths:
      - .github/fix478.patch.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/472_ledger_auth_user
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          base64 -d .github/fix478.patch.b64 | gzip -d > /tmp/fix478.patch
          git apply --index /tmp/fix478.patch
          rm -f .github/fix478.patch.b64
          rm -f .github/workflows/apply-fix478.yml
          rm -f .github/workflows/tmp-export-review.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: 补齐 Ledger 模块边界与权限校验"
          git push origin HEAD:refactor/472_ledger_auth_user
