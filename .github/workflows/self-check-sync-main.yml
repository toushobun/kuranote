name: Self-check format audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/self-check-sync-main.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format audit document
        run: npx prettier --write docs/security-definer-functions.md

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "格式无需调整。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security-definer-functions.md
          git commit -m "style: 格式化安全函数盘点文档"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
