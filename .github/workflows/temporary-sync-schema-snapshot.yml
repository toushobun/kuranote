name: Temporary sync schema snapshot

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.repository == 'toushobun/kuranote' &&
      github.event.pull_request.number == 460 &&
      github.event.pull_request.head.ref == 'fix/459_ledger_owner_bootstrap'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/459_ledger_owner_bootstrap

      - name: Download generated snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/8376925271/zip > /tmp/current-schema-snapshot.zip
          unzip -p /tmp/current-schema-snapshot.zip > supabase/schema_snapshot/current_schema.sql

      - name: Commit snapshot
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin HEAD:fix/459_ledger_owner_bootstrap
