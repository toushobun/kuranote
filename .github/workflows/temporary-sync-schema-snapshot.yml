name: Temporary sync schema snapshot

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  actions: read
  contents: write

jobs:
  sync-schema-snapshot:
    if: >-
      github.event.pull_request.number == 460 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/459_ledger_owner_bootstrap' &&
      github.actor == 'toushobun'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/459_ledger_owner_bootstrap
          fetch-depth: 0

      - name: Download generated schema snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --location --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/8375356720/zip" \
            --output /tmp/current-schema-snapshot.zip
          unzip -p /tmp/current-schema-snapshot.zip kuranote-current-schema.sql \
            > supabase/schema_snapshot/current_schema.sql

      - name: Verify generated file
        run: |
          grep -Fq -- "-- 此文件由 supabase/migrations 自动生成，禁止手工修改。" \
            supabase/schema_snapshot/current_schema.sql
          changed_files="$(git diff --name-only)"
          if [[ "${changed_files}" != "supabase/schema_snapshot/current_schema.sql" ]]; then
            echo "只允许更新数据库结构快照，实际变更：" >&2
            echo "${changed_files}" >&2
            exit 1
          fi

      - name: Commit schema snapshot
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin HEAD:fix/459_ledger_owner_bootstrap
