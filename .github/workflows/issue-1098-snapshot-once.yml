name: Issue 1098 snapshot one-off
on:
  push:
    branches: [fix/1098_refund_candidate_merchant_first]
    paths: [.github/workflows/issue-1098-snapshot-once.yml]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/1098_refund_candidate_merchant_first
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Setup Supabase version
        id: version
        run: echo "version=$(cat .supabase-version)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.version.outputs.version }}
      - run: supabase start
      - run: CI=1 npm run db:schema:snapshot:update
      - name: Save generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新退款候选搜索规则的结构快照"
            git fetch origin fix/1098_refund_candidate_merchant_first
            git rebase origin/fix/1098_refund_candidate_merchant_first
            git push origin HEAD:fix/1098_refund_candidate_merchant_first
          fi
