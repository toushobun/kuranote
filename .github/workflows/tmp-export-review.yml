name: Temporary review export

on:
  push:
    branches:
      - refactor/472_ledger_auth_user
    paths:
      - .github/workflows/tmp-export-review.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: .
          include-hidden-files: true
          retention-days: 1
