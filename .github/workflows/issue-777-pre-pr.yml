name: Issue 777 pre-PR checks

on:
  push:
    branches:
      - feature/777_data_import_execution

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/777_data_import_execution

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply remaining mechanical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/internal/dataImport/service/dataImportExecutionService.ts')
          s = p.read_text()
          s = s.replace(
              '  offset: number;\n  userId: string;\n',
              '  offset: number;\n  timeZoneOffsetMinutes: number;\n  userId: string;\n',
          )
          s = s.replace(
              '    async executeBatch({ fileBuffer, fileName, ledgerId, offset, userId }) {',
              '    async executeBatch({\n      fileBuffer,\n      fileName,\n      ledgerId,\n      offset,\n      timeZoneOffsetMinutes,\n      userId,\n    }) {',
          )
          s = s.replace(
              '          note: first.note,\n          transactionAt: first.transactionAt,',
              '          note: first.note,\n          timeZoneOffsetMinutes,\n          transactionAt: first.transactionAt,',
          )
          s = s.replace(
              '          fromAccountName: row.fromAccountName,\n          ledgerId,\n          note: row.note,\n          toAccountName: row.toAccountName,\n          transactionAt: row.transactionAt,',
              '          ledgerId,\n          note: row.note,\n          timeZoneOffsetMinutes,\n          transactionAt: row.transactionAt,',
          )
          p.write_text(s)

          p = Path('src/components/templates/settings/useDataImportForm.ts')
          s = p.read_text()
          s = s.replace(
              '    const runToken = runTokenRef.current + 1;\n',
              '    const timeZoneOffsetMinutes = new Date().getTimezoneOffset();\n    const runToken = runTokenRef.current + 1;\n',
          )
          s = s.replace(
              '        formData.set("offset", String(offset));\n',
              '        formData.set("offset", String(offset));\n        formData.set("timeZoneOffsetMinutes", String(timeZoneOffsetMinutes));\n',
          )
          p.write_text(s)

          p = Path('src/internal/transaction/service/transactionImportService.test.ts')
          s = p.read_text()
          s = s.replace(
              '      note: null,\n      totalAmount: 1200,',
              '      note: null,\n      timeZoneOffsetMinutes: 0,\n      totalAmount: 1200,',
          )
          s = s.replace(
              '      note: null,\n      transactionAt: "2026-09-17 10:00:00",\n      transferAmount: 5000,',
              '      note: null,\n      timeZoneOffsetMinutes: 0,\n      transactionAt: "2026-09-17 10:00:00",\n      transferAmount: 5000,',
          )
          s = s.replace(
              '        note: null,\n        transactionAt: "2026-09-17 10:00:00",\n        transferAmount: 5000,',
              '        note: null,\n        timeZoneOffsetMinutes: 0,\n        transactionAt: "2026-09-17 10:00:00",\n        transferAmount: 5000,',
          )
          p.write_text(s)

          p = Path('src/internal/dataImport/service/dataImportExecutionService.test.ts')
          s = p.read_text()
          s = s.replace(
              '      offset: 0,\n      userId: "user-1",',
              '      offset: 0,\n      timeZoneOffsetMinutes: 0,\n      userId: "user-1",',
          )
          p.write_text(s)
          PY

          npx prettier . --write

      - name: Commit mechanical fixes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix: 补齐数据导入时区参数并统一格式"
            git push origin HEAD:feature/777_data_import_execution
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier . --check

      - name: Unit tests
        run: npx vitest run --exclude "tests/rsc/**"
