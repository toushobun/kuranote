name: PR605 Sync Schema Snapshot

on:
  push:
    branches:
      - feature/605_pr1_release_offset_cap
    paths:
      - .github/workflows/pr605-sync-schema-snapshot.yml

permissions:
  contents: write
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/605_pr1_release_offset_cap
          fetch-depth: 0

      - name: Download generated schema snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/current-schema-snapshot
          mkdir -p /tmp/current-schema-snapshot
          gh run download 32156377981 \
            --repo "${GITHUB_REPOSITORY}" \
            --name current-schema-snapshot \
            --dir /tmp/current-schema-snapshot
          cp /tmp/current-schema-snapshot/kuranote-current-schema.sql \
            supabase/schema_snapshot/current_schema.sql

      - name: Commit generated snapshot
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "结构快照无需更新。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新数据库结构快照"
          git push origin HEAD:feature/605_pr1_release_offset_cap
