# #944 临时格式整理：仅对当前 PR 本仓库分支运行，验证完成后移除此文件。
name: Issue 944 temporary format
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/944_refund_reimbursement_item_type'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm ci
      - name: 格式化本 PR 涉及的源文件并推送
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' paths < <(
            git diff --name-only --diff-filter=AM -z origin/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.md' '*.css'
          )
          if (( ${#paths[@]} == 0 )); then
            exit 0
          fi
          npx prettier --write "${paths[@]}"
          git add -- "${paths[@]}"
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style: 统一 #944 改动文件的代码格式"
            git push origin HEAD:refs/heads/feat/944_refund_reimbursement_item_type
          fi
