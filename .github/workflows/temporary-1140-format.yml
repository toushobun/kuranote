name: Temporary 1140 formatter
on:
  pull_request:
    paths:
      - '.github/workflows/temporary-1140-format.yml'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format changed files and print machine-readable text
        run: |
          npx --yes prettier@3.8.3 --write src/components/organisms/transactions/TransferReceipt/transferCurrency.test.ts src/components/organisms/transactions/TransferReceipt/transferCurrency.ts src/components/organisms/transactions/TransferReceipt/TransferReceipt.stories.tsx src/components/organisms/transactions/TransferReceipt/TransferReceipt.test.tsx src/components/organisms/transactions/TransferReceipt/TransferReceipt.tsx src/components/organisms/transactions/TransferReceipt/useTransferReceipt.ts src/config/transactionStepFlowMessages.ts src/internal/exchangeRate/controller/dailyExchangeRateController.ts src/internal/exchangeRate/repository/dailyExchangeRateRepository.ts src/internal/exchangeRate/router.test.ts src/internal/exchangeRate/router.ts src/internal/exchangeRate/schema.ts src/internal/exchangeRate/service/dailyExchangeRateService.test.ts src/internal/exchangeRate/service/dailyExchangeRateService.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const paths = ["src/components/organisms/transactions/TransferReceipt/transferCurrency.test.ts","src/components/organisms/transactions/TransferReceipt/transferCurrency.ts","src/components/organisms/transactions/TransferReceipt/TransferReceipt.stories.tsx","src/components/organisms/transactions/TransferReceipt/TransferReceipt.test.tsx","src/components/organisms/transactions/TransferReceipt/TransferReceipt.tsx","src/components/organisms/transactions/TransferReceipt/useTransferReceipt.ts","src/config/transactionStepFlowMessages.ts","src/internal/exchangeRate/controller/dailyExchangeRateController.ts","src/internal/exchangeRate/repository/dailyExchangeRateRepository.ts","src/internal/exchangeRate/router.test.ts","src/internal/exchangeRate/router.ts","src/internal/exchangeRate/schema.ts","src/internal/exchangeRate/service/dailyExchangeRateService.test.ts","src/internal/exchangeRate/service/dailyExchangeRateService.ts"];
          for (const path of paths) {
            const content = fs.readFileSync(path, 'utf8');
            console.log('1140_FILE_START ' + JSON.stringify(path));
            for (let i = 0; i < content.length; i += 1000) {
              console.log('1140_CHUNK ' + JSON.stringify(content.slice(i, i + 1000)));
            }
            console.log('1140_FILE_END');
          }
          NODE
