name: Temporary 1140 Formatting
on:
  push:
    branches:
      - feat/1140_prefill_transfer_target_amount
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-a357e034a6fee41c9a534aad47e5f8a800e39aff2c599f64b3a62689ee12b47f
      - name: Format and export
        shell: bash
        run: |
          file="src/components/organisms/transactions/TransferReceipt/TransferReceipt.test.tsx"
          npx --no-install prettier "$file" --write
          echo "BEGIN_FORMAT_FILE:$file"
          base64 -w0 "$file"
          echo
          echo "END_FORMAT_FILE:$file"
