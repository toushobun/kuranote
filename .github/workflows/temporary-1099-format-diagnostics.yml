name: Temporary 1099 formatting diagnostics
on:
  push:
    branches:
      - perf/1099_search_db_pagination
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Print exact prettier diff
        run: |
          npx prettier src/internal/transaction/service/transactionService.test.ts --write
          git diff -- src/internal/transaction/service/transactionService.test.ts
