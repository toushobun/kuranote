name: Sync issue 468 transaction status

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.repository == 'toushobun/kuranote' && github.head_ref == 'refactor/475_migrate_statistics_dashboard'
    runs-on: ubuntu-latest
    steps:
      - name: Mark Transaction migration completed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/toushobun/kuranote/issues/468 --jq .body > issue-body.md
          python - <<'PY'
          from pathlib import Path

          path = Path("issue-body.md")
          body = path.read_text()
          unchecked = "- [ ] 迁移 Transaction（#474）"
          checked = "- [x] 迁移 Transaction（#474）"

          if checked in body:
              raise SystemExit(0)
          if unchecked not in body:
              raise SystemExit("target checkbox was not found")

          path.write_text(body.replace(unchecked, checked, 1))
          PY
          jq -Rs '{body: .}' issue-body.md > payload.json
          gh api --method PATCH repos/toushobun/kuranote/issues/468 --input payload.json
