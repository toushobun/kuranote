name: Issue 500 test diagnostics

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'refactor/500_internal_router_table'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Format changes
        run: npm run format

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit --no-verify -m 'style: 格式化 internal 架构测试'
          git push origin HEAD:${{ github.head_ref }}

      - name: Run tests with diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee /tmp/issue-500-test.log
          test_status=${PIPESTATUS[0]}
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Report test diagnostics
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- issue-500-test-diagnostics -->'
            echo 'Issue #500 单测失败诊断：'
            echo
            echo '```text'
            tail -n 300 /tmp/issue-500-test.log
            echo '```'
          } > /tmp/issue-500-test-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/issue-500-test-comment.md
          exit 1
