name: Issue 500 test diagnostics

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnostics:
    if: github.event.pull_request.head.ref == 'refactor/500_internal_router_table'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with diagnostics
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run test 2>&1 | tee /tmp/issue-500-test.log
          test_status=${PIPESTATUS[0]}
          echo "status=$test_status" >> "$GITHUB_OUTPUT"
          exit "$test_status"

      - name: Report test diagnostics
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/issue-500-test.log > /tmp/issue-500-test-clean.log
          {
            echo '<!-- issue-500-test-diagnostics -->'
            echo 'Issue #500 单测失败诊断：'
            echo
            echo '```text'
            awk '
              /FAIL |Failed Tests|AssertionError|Test Files/ { capture = 1 }
              capture { print }
            ' /tmp/issue-500-test-clean.log | tail -n 240
            echo '```'
          } > /tmp/issue-500-test-comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/issue-500-test-comment.md
          exit 1
