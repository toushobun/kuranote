name: Codex PR 568 fix

on:
  push:
    branches:
      - feature/551_transaction_item_special_status
    paths:
      - .github/workflows/codex-pr568-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/551_transaction_item_special_status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}
      - name: Apply reviewed fixes
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/codex_pr568_fix.py
          python /tmp/codex_pr568_fix.py
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            supabase/migrations/20260803190000_fix_transaction_item_special_status_review.sql \
            supabase/tests/database/transaction_item_special_status.test.sql \
            src/internal/db-types.ts \
            src/internal/transaction/util/transactionAmountHelpers.ts \
            src/internal/transaction/util/transactionAmountHelpers.test.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/schema.test.ts \
            src/internal/transaction/errors.ts \
            src/internal/transaction/entity/transactionGrouping.ts \
            src/types/transactions.ts \
            src/internal/transaction/util/grouping/filters.ts \
            src/internal/transaction/adapter/next/loadTransactionViews.ts \
            src/internal/transaction/repository/transactionRepository.ts \
            src/internal/transaction/service/transactionService.ts \
            src/internal/transaction/service/transactionService.test.ts \
            src/internal/transaction/service/read/transactionReadModels.ts \
            src/internal/transaction/service/read/transactionFormService.ts \
            app/'(protected)'/transactions/'[transactionRecordId]'/edit/page.tsx \
            src/components/templates/transactions/TransactionFormPage.tsx \
            src/components/organisms/transactions/TransactionGroupList/TransactionGroupList.tsx \
            src/internal/transaction/util/buildTransactionListItem.ts \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.ts \
            src/components/organisms/transactions/TransactionForm/TransactionForm.tsx
      - name: Type check and targeted tests
        run: |
          npx tsc --noEmit
          npx vitest run \
            src/internal/transaction/util/transactionAmountHelpers.test.ts \
            src/internal/transaction/schema.test.ts \
            src/internal/transaction/service/transactionService.test.ts
      - name: Start Supabase and test migrations
        shell: bash
        run: |
          supabase start
          npm run db:security-definer:check
          supabase test db
          npm run db:schema:snapshot:update
      - name: Full code verification
        run: |
          npm run format:check
          npm run lint
          npm run test
          npm run build
          npm run build-storybook
      - name: Commit fixes
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          git rm .github/workflows/codex-pr568-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 修复交易明细特殊状态评审问题'
          git push origin HEAD:feature/551_transaction_item_special_status
