name: Apply PR 443 review fixes

on:
  push:
    branches:
      - feature/442_improve_ledger_invite_interactions

permissions:
  contents: write

jobs:
  apply-review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/442_improve_ledger_invite_interactions
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply review fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              path.write_text(text.replace(old, new, 1))

          service_test = Path("src/server/services/ledgerInvite.test.ts")
          replace_once(
              service_test,
              '  loadLedgerInvitePreview,\n} from "./ledgerInvite";',
              '  loadLedgerInvitePreview,\n  replaceLedgerInviteService,\n} from "./ledgerInvite";',
          )

          replace_tests = r'''
          describe("replaceLedgerInviteService", () => {
            it("替换成功时返回新邀请信息", async () => {
              const supabase = createSupabaseMock({
                rpcResponse: {
                  data: [
                    {
                      invite_id: "invite-new",
                      invite_role: "admin",
                      token: "new-token",
                    },
                  ],
                },
              });
              mocks.createClient.mockResolvedValue(supabase.client);

              await expect(
                replaceLedgerInviteService("ledger-id", "invite-old"),
              ).resolves.toEqual({
                inviteId: "invite-new",
                ok: true,
                role: "admin",
                token: "new-token",
              });
              expect(supabase.rpc).toHaveBeenCalledWith("replace_ledger_invite", {
                p_invite_id: "invite-old",
                p_ledger_id: "ledger-id",
              });
            });

            it("权限不足时映射 permission_denied", async () => {
              const consoleError = vi
                .spyOn(console, "error")
                .mockImplementation(() => {});
              const supabase = createSupabaseMock({
                rpcResponse: {
                  error: {
                    code: "42501",
                    details: "permission_denied",
                    hint: null,
                    message: "权限不足",
                  },
                },
              });
              mocks.createClient.mockResolvedValue(supabase.client);

              await expect(
                replaceLedgerInviteService("ledger-id", "invite-old"),
              ).resolves.toEqual({
                error: ledgerInviteErrorCodes.permissionDenied,
                ok: false,
              });
              expect(consoleError).not.toHaveBeenCalled();
              consoleError.mockRestore();
            });

            it.each([
              null,
              [],
              [{}],
              [{ invite_id: "invite-new", invite_role: "owner", token: "token" }],
            ])("RPC 返回无效数据 %j 时返回 create_failed", async (data) => {
              const consoleError = vi
                .spyOn(console, "error")
                .mockImplementation(() => {});
              const supabase = createSupabaseMock({ rpcResponse: { data } });
              mocks.createClient.mockResolvedValue(supabase.client);

              await expect(
                replaceLedgerInviteService("ledger-id", "invite-old"),
              ).resolves.toEqual({
                error: ledgerInviteErrorCodes.createFailed,
                ok: false,
              });
              expect(consoleError).toHaveBeenCalledWith(
                "[ledgerInvite] replace_ledger_invite returned invalid data",
                {
                  isArray: Array.isArray(data),
                  rowCount: Array.isArray(data) ? data.length : null,
                },
              );
              consoleError.mockRestore();
            });

            it("未知 RPC 错误仅记录非敏感诊断字段并返回 create_failed", async () => {
              const consoleError = vi
                .spyOn(console, "error")
                .mockImplementation(() => {});
              const supabase = createSupabaseMock({
                rpcResponse: {
                  error: {
                    code: "XX000",
                    details: "possibly-sensitive-details",
                    hint: "Retry later",
                    message: "unexpected database error",
                  },
                },
              });
              mocks.createClient.mockResolvedValue(supabase.client);

              await expect(
                replaceLedgerInviteService("ledger-id", "invite-old"),
              ).resolves.toEqual({
                error: ledgerInviteErrorCodes.createFailed,
                ok: false,
              });
              expect(consoleError).toHaveBeenCalledWith(
                "[ledgerInvite] replace_ledger_invite failed",
                {
                  code: "XX000",
                  hint: "Retry later",
                  message: "unexpected database error",
                },
              );
              expect(consoleError).not.toHaveBeenCalledWith(
                expect.anything(),
                expect.objectContaining({ details: expect.anything() }),
              );
              consoleError.mockRestore();
            });
          });
          '''.strip()
          replace_once(
              service_test,
              '\n\ndescribe("loadLedgerInvitePreview", () => {',
              f'\n\n{replace_tests}\n\ndescribe("loadLedgerInvitePreview", () => {{',
          )

          action_test = Path("src/server/actions/ledgerInvite.test.ts")
          replace_once(
              action_test,
              '    formData.set("ledgerId", "ledger-id");\n    formData.set("role", role);\n\n    formData.set("ledgerId", "ledger/id");',
              '    formData.set("ledgerId", "ledger/id");\n    formData.set("role", role);',
          )

          migration = Path(
              "supabase/migrations/20260715150000_improve_ledger_invite_roles_and_replacement.sql"
          )
          replace_once(
              migration,
              "-- 数据库仍只保存 token 摘要；替换在同一事务中使旧邀请失效并生成新邀请。\n",
              "-- 数据库仍只保存 token 摘要；替换在同一事务中使旧邀请失效并生成新邀请。\n\n"
              "-- v2 已完全替代旧创建入口，移除不再使用且仅支持旧角色集合的 RPC。\n"
              "drop function if exists public.create_ledger_invite(uuid, text);\n",
          )

          migration_test = Path("src/server/db/ledgerInviteRolesMigration.test.ts")
          replace_once(
              migration_test,
              '  it("接受邀请的 trigger 允许三种邀请角色", () => {',
              '  it("移除已由 v2 替代的旧创建 RPC", () => {\n'
              '    expect(migrationSql).toContain(\n'
              '      "drop function if exists public.create_ledger_invite(uuid, text);",\n'
              '    );\n'
              '  });\n\n'
              '  it("接受邀请的 trigger 允许三种邀请角色", () => {',
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Format touched TypeScript tests
        run: >-
          npx prettier --write
          src/server/services/ledgerInvite.test.ts
          src/server/actions/ledgerInvite.test.ts
          src/server/db/ledgerInviteRolesMigration.test.ts

      - name: Run targeted tests
        run: >-
          npx vitest run
          src/server/services/ledgerInvite.test.ts
          src/server/actions/ledgerInvite.test.ts
          src/server/db/ledgerInviteRolesMigration.test.ts

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Regenerate schema snapshot
        run: npm run db:schema:snapshot:update
        env:
          CI: "1"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/pr443-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr443-review-fixes.yml \
            src/server/actions/ledgerInvite.test.ts \
            src/server/db/ledgerInviteRolesMigration.test.ts \
            src/server/services/ledgerInvite.test.ts \
            supabase/migrations/20260715150000_improve_ledger_invite_roles_and_replacement.sql \
            supabase/schema_snapshot/current_schema.sql
          git commit -m "test: 补齐邀请替换服务验证并移除旧 RPC"
          git push origin HEAD:feature/442_improve_ledger_invite_interactions
