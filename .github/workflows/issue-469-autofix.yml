name: Issue 469 autofix

on:
  push:
    branches:
      - perf/469_category_reorder_transactional_rpc

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: perf/469_category_reorder_transactional_rpc
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npm run format

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Update schema snapshot
        env:
          CI: "1"
        run: npm run db:schema:snapshot:update

      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: 更新分类排序格式与数据库快照"
          git push origin HEAD:perf/469_category_reorder_transactional_rpc
