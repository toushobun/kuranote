name: Finalize issue 572

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 0

      - name: Check finalization scope
        id: scope
        run: |
          if [ -f supabase/migrations/20260805020000_support_refund_allocation_edit.sql ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare tests and self-review fixes
        if: steps.scope.outputs.run == 'true'
        run: |
          rm -f .github/issue-572-vitest.json
          python .github/scripts/issue-572-finalize.py
          git checkout -- .github/workflows/migration-check.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/issue-572-self-review.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('      message: "报销和退款关联只能在新建收入交易时设置。",', '        "报销和退款关联只能在新建收入交易时设置。",')
          text = text.replace('      message: "报销关联只能在新建收入交易时设置。",', '        "报销关联只能在新建收入交易时设置。",')
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/issue-572-self-review.py

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Format
        if: steps.scope.outputs.run == 'true'
        run: npx prettier --write src

      - name: Check diff
        if: steps.scope.outputs.run == 'true'
        run: git diff --check

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scope.outputs.run == 'true'
        run: npm run type-check

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm run test -- --run

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - uses: supabase/setup-cli@v2
        if: steps.scope.outputs.run == 'true'
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Database tests
        if: steps.scope.outputs.run == 'true'
        run: |
          supabase test db
          bash supabase/tests/database/refund_allocation_concurrency.sh

      - name: Update schema snapshot
        if: steps.scope.outputs.run == 'true'
        env:
          CI: "true"
        run: bash scripts/update-schema-snapshot.sh

      - name: Stop local Supabase
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup > /dev/null 2>&1 || true
          fi

      - name: Commit implementation and tests
        if: steps.scope.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git commit -m "fix: 完善退款分摊编辑与金额校验"
          git push origin HEAD:feature/572_refund_multi_item_allocation
