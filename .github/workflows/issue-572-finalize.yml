name: Finalize issue 572

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 0

      - name: Check finalization scope
        id: scope
        run: |
          if grep -q "export function toRefundMinorUnits" src/internal/transaction/util/refundAllocation.ts; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare implementation and tests
        if: steps.scope.outputs.run == 'true'
        run: |
          rm -f .github/issue-572-vitest.json
          python .github/scripts/issue-572-finalize.py
          git checkout -- .github/workflows/migration-check.yml
          python - <<'PY'
          from pathlib import Path

          script_path = Path('.github/scripts/issue-572-self-review.py')
          script = script_path.read_text(encoding='utf-8')
          script = script.replace(
              '      message: "报销和退款关联只能在新建收入交易时设置。",',
              '        "报销和退款关联只能在新建收入交易时设置。",',
          )
          script = script.replace(
              '      message: "报销关联只能在新建收入交易时设置。",',
              '        "报销关联只能在新建收入交易时设置。",',
          )
          script_path.write_text(script, encoding='utf-8')
          PY
          python .github/scripts/issue-572-self-review.py
          rm -f supabase/migrations/20260805020000_support_refund_allocation_edit.sql
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/refund_allocation_edit.test.sql')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    income_category.id as income_category_id,\n    expense_item.created_by as user_id',
              '    income_category.id as income_category_id,\n    merchant.id as merchant_id,\n    expense_item.created_by as user_id',
          )
          text = text.replace(
              ') income_category on true\nlimit 1;',
              ") income_category on true\njoin lateral (\n"
              "    select m.id\n"
              "    from public.merchant m\n"
              "    where m.ledger_id = expense_item.ledger_id\n"
              "      and m.is_archived = false\n"
              "    limit 1\n"
              ") merchant on true\nlimit 1;",
          )
          text = text.replace(
              "    null,\n    '退款编辑测试',",
              "    merchant_id,\n    '退款编辑测试',",
          )
          text = text.replace(
              "            null,\n            '编辑后'",
              "            (select merchant_id from test_refund_edit_context),\n            '编辑后'",
          )
          text = text.replace(
              "            null,\n            '无效编辑'",
              "            (select merchant_id from test_refund_edit_context),\n            '无效编辑'",
          )
          text = text.replace(
              "            null,\n            '取消退款关联'",
              "            (select merchant_id from test_refund_edit_context),\n            '取消退款关联'",
          )
          text = text.replace(
              "set local role authenticated;",
              "grant select on test_refund_edit_context to authenticated;\nset local role authenticated;",
          )
          text = text.replace(
              "jsonb_build_object(\n                    'amount',",
              "jsonb_build_object(\n                    'id', '57242000-0000-4000-8000-000000000002',\n                    'amount',",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: npm ci

      - name: Format
        if: steps.scope.outputs.run == 'true'
        run: npx prettier --write src

      - name: Check diff
        if: steps.scope.outputs.run == 'true'
        run: git diff --check

      - name: Lint
        if: steps.scope.outputs.run == 'true'
        run: npm run lint

      - name: Type check
        if: steps.scope.outputs.run == 'true'
        run: npm run type-check

      - name: Unit tests
        if: steps.scope.outputs.run == 'true'
        run: npm run test -- --run

      - name: Build
        if: steps.scope.outputs.run == 'true'
        run: npm run build

      - uses: supabase/setup-cli@v2
        if: steps.scope.outputs.run == 'true'
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Database tests
        if: steps.scope.outputs.run == 'true'
        run: |
          supabase test db
          bash supabase/tests/database/refund_allocation_concurrency.sh

      - name: Update schema snapshot
        if: steps.scope.outputs.run == 'true'
        env:
          CI: "true"
        run: bash scripts/update-schema-snapshot.sh

      - name: Stop local Supabase
        if: always() && steps.scope.outputs.run == 'true'
        run: supabase stop --no-backup > /dev/null 2>&1 || true

      - name: Commit implementation and tests
        if: steps.scope.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git commit -m "fix: 完善退款分摊编辑与金额校验"
          git push origin HEAD:feature/572_refund_multi_item_allocation
