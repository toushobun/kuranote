name: Finalize issue 572

on:
  push:
    branches:
      - feature/572_refund_multi_item_allocation
    paths:
      - .github/scripts/issue-572-finalize.py
      - .github/scripts/issue-572-self-review.py
      - .github/workflows/issue-572-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/572_refund_multi_item_allocation
          fetch-depth: 0

      - name: Prepare tests and self-review fixes
        run: |
          rm -f .github/issue-572-vitest.json
          python .github/scripts/issue-572-finalize.py
          git checkout -- .github/workflows/migration-check.yml
          python .github/scripts/issue-572-self-review.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npx prettier --write src

      - name: Check diff
        run: git diff --check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test -- --run

      - name: Build
        run: npm run build

      - uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Database tests
        run: |
          supabase test db
          bash supabase/tests/database/refund_allocation_concurrency.sh

      - name: Update schema snapshot
        env:
          CI: "true"
        run: bash scripts/update-schema-snapshot.sh

      - name: Stop local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup > /dev/null 2>&1 || true
          fi

      - name: Commit implementation and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src supabase
          git commit -m "fix: 完善退款分摊编辑与金额校验"
          git push origin HEAD:feature/572_refund_multi_item_allocation
