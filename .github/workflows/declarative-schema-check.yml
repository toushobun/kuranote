name: Declarative schema check

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/schemas/**"
      - "supabase/config.toml"
      - "scripts/check-declarative-schema.sh"
      - "scripts/update-declarative-schema.sh"
      - "scripts/new-declarative-migration.sh"
      - "package.json"
      - ".supabase-version"
      - ".github/workflows/declarative-schema-check.yml"
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  declarative-schema-check:
    name: Declarative schema check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax check maintenance scripts
        run: |
          bash -n scripts/check-declarative-schema.sh
          bash -n scripts/update-declarative-schema.sh
          bash -n scripts/new-declarative-migration.sh

      - name: ShellCheck maintenance scripts
        run: |
          shellcheck \
            scripts/check-declarative-schema.sh \
            scripts/update-declarative-schema.sh \
            scripts/new-declarative-migration.sh

      - name: Check migration history is append-only
        shell: bash
        run: |
          changed_migrations="$(git diff --name-only --diff-filter=MDR \
            "${{ github.event.pull_request.base.sha }}" HEAD -- supabase/migrations/)"
          if [[ -n "${changed_migrations}" ]]; then
            echo "已经合入 main 的 migration 不允许修改、删除或重命名：" >&2
            echo "${changed_migrations}" >&2
            echo "请新增向前 migration 表达数据库变更。" >&2
            exit 1
          fi

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version_file=".supabase-version"
          if [[ ! -f "${version_file}" ]]; then
            echo "未找到 Supabase CLI 版本文件：${version_file}" >&2
            exit 1
          fi
          version="$(tr -d '[:space:]' <"${version_file}")"
          if [[ -z "${version}" ]]; then
            echo "Supabase CLI 版本文件为空：${version_file}" >&2
            exit 1
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Supabase CLI 版本文件内容异常：${version_file}（读取到 \"${version}\"，应为形如 2.106.0 的版本号）" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Compare migrations with declarative schema
        run: npm run db:schema:check
        env:
          ACTUAL_SCHEMA_PATH: /tmp/kuranote-current-schema.sql

      - name: Upload generated schema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-schema
          path: /tmp/kuranote-current-schema.sql
          if-no-files-found: ignore

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
