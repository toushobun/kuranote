name: Format Issue 755 temp

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/755_balance_adjustment_transaction_type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Format affected files
        run: >-
          npx prettier --write
          src/internal/transaction/repository/transactionRepository.test.ts
          src/internal/transaction/schema.ts
          src/internal/transaction/service/read/transactionFormService.test.ts
          src/internal/transaction/service/transactionService.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/internal/transaction/repository/transactionRepository.test.ts \
            src/internal/transaction/schema.ts \
            src/internal/transaction/service/read/transactionFormService.test.ts \
            src/internal/transaction/service/transactionService.test.ts
          git commit -m "style: 格式化余额调整相关代码"
          git push origin HEAD:${{ github.head_ref }}
