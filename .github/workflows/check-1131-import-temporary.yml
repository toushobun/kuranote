name: Temporary validation for Issue 1131 import
on:
  push:
    branches:
      - feat/1131_import_receipt_photos
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show Prettier changes
        run: |
          npx prettier src --write >/dev/null
          git diff -- src
      - run: npm run type-check
      - run: npm run lint
      - run: npm run format:check
      - run: npx vitest run src/internal/dataImport/errors.test.ts src/internal/dataImport/adapter/next/loadDataImportHolderMappingOptions.test.ts src/internal/dataExport/adapter/next/actions.test.ts src/utils/dataExportWorkbook.test.ts src/internal/dataImport/util/readWorksheetPhotos.test.ts src/utils/dataImportPhotoBatch.test.ts src/components/organisms/settings/DataImportPhotoPreview/DataImportPhotoPreview.test.tsx src/internal/dataImport/service/dataImportExecutionService.test.ts
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
