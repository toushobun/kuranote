name: PR1139 Final Repository Recheck

on:
  push:
    branches:
      - feat/1139_convert_totals_to_ledger_currency

permissions:
  contents: write

env:
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta

jobs:
  verify:
    name: Type, lint, format, database and Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format changed source files and record correction
        run: |
          npx prettier --write src/internal/transaction/errors.ts src/internal/transaction/repository/transactionRecordRateRepository.ts src/internal/transaction/repository/transactionRecordRateRepository.test.ts
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/internal/transaction/errors.ts src/internal/transaction/repository/transactionRecordRateRepository.ts src/internal/transaction/repository/transactionRecordRateRepository.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: 整理交易汇率仓储测试格式'
            git push origin HEAD:feat/1139_convert_totals_to_ledger_currency
          fi
      - run: |
          npm run type-check
          npm run lint
          npm run format:check
          npm run db:security-definer:test
          npm run db:security-definer:check
      - uses: supabase/setup-cli@v2
        with:
          version: 2.106.0
          github-token: ${{ github.token }}
      - run: supabase start -x "$SUPABASE_START_EXCLUDE"
      - run: npm run db:schema:snapshot:check
      - run: supabase db reset
      - name: Database pgTAP and concurrency tests
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file scripts/security-definer-smoke.sql
          supabase test db
          for script in supabase/tests/database/*.sh; do bash "$script"; done
      - run: npm run build-storybook
  vitest:
    name: Vitest (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test -- --shard=${{ matrix.shard }}/4
