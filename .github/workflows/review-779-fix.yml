name: PR 779 review fix

on:
  push:
    branches:
      - feature/777_data_import_execution

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/777_data_import_execution

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Apply remaining source fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path("src/internal/transaction/schema.ts")
          text = schema.read_text()
          import_line = 'import {\n  parseTimeZoneOffsetMinutes,\n  toTransactionTimestamp,\n} from "internal/transaction/util/transactionTimestamp";\n'
          if import_line not in text:
              text = text.replace('import { z } from "@hono/zod-openapi";\n', 'import { z } from "@hono/zod-openapi";\n' + import_line)
          start = text.index("function parseTimeZoneOffsetMinutes")
          end = text.index("function parseTransactionItems")
          text = text[:start] + 'function parseTransactionAt(value: string, offsetMinutes: number) {\n  return toTransactionTimestamp(value, offsetMinutes, "form");\n}\n\n' + text[end:]
          schema.write_text(text)

          service = Path("src/internal/transaction/service/transactionImportService.ts")
          text = service.read_text()
          import_line = 'import { toTransactionTimestamp } from "internal/transaction/util/transactionTimestamp";\n'
          marker = 'import type { TransactionService } from "internal/transaction/service/transactionService";\n'
          if import_line not in text:
              text = text.replace(marker, marker + import_line)
          start = text.index("/** 与普通记账表单相同")
          end = text.index("function sameAmount")
          wrapper = 'function toImportTransactionTimestamp(\n  value: string,\n  offsetMinutes: number,\n) {\n  const timestamp = toTransactionTimestamp(value, offsetMinutes, "import");\n  if (!timestamp) throw dateInvalid();\n  return timestamp;\n}\n\n'
          text = text[:start] + wrapper + text[end:]
          text = text.replace("transactionAt: toTransactionTimestamp(\n", "transactionAt: toImportTransactionTimestamp(\n")
          text = text.replace("const transactionAtIso = toTransactionTimestamp(\n", "const transactionAtIso = toImportTransactionTimestamp(\n")
          service.write_text(text)

          test_file = Path("src/internal/transaction/service/transactionImportService.test.ts")
          text = test_file.read_text().replace("timeZoneOffsetMinutes: 0,", "timeZoneOffsetMinutes: -540,")
          test_file.write_text(text)
          PY

          npx prettier src/internal/transaction/schema.ts src/internal/transaction/service/transactionImportService.ts src/internal/transaction/service/transactionImportService.test.ts src/internal/transaction/util/transactionTimestamp.ts --write

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Format check
        run: npx prettier . --check

      - name: Unit tests
        run: npx vitest run --exclude "tests/rsc/**"

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/review-779-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: 统一交易时间转换逻辑"
          git push origin HEAD:feature/777_data_import_execution
