name: Issue 574 PR1 Snapshot Sync

on:
  push:
    branches:
      - feature/574_pr1_db_unfreeze_and_locking

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/574_pr1_db_unfreeze_and_locking
          fetch-depth: 0

      - name: Read Supabase CLI version
        id: supabase_version
        shell: bash
        run: |
          version="$(<.supabase-version)"
          version="${version%$'\r'}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ steps.supabase_version.outputs.version }}
          github-token: ${{ github.token }}

      - name: Start local Supabase
        run: supabase start

      - name: Regenerate schema snapshot
        env:
          CI: "true"
        run: npm run db:schema:snapshot:update

      - name: Commit generated snapshot
        shell: bash
        run: |
          if git diff --quiet -- supabase/schema_snapshot/current_schema.sql; then
            echo "结构快照无需更新。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema_snapshot/current_schema.sql
          git commit -m "chore: 更新 #574 PR1 结构快照"
          git push origin HEAD:feature/574_pr1_db_unfreeze_and_locking

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
