name: PR1139 Temporary Validation
on:
  push:
    branches:
      - feat/1139_convert_totals_to_ledger_currency
permissions:
  contents: write
concurrency:
  group: pr1139-review-${{ github.ref }}
  cancel-in-progress: true
env:
  SUPABASE_START_EXCLUDE: studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1139_convert_totals_to_ledger_currency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Format changed source files
        run: |
          git diff --name-only -z --diff-filter=ACM "$(git merge-base HEAD origin/main)" HEAD -- '*.ts' '*.tsx' | xargs -0 -r npx prettier --write
          git diff --check
      - name: Check TypeScript, lint and formatting
        run: |
          npm run type-check
          npm run lint
          npm run format:check
      - name: Verify one real ECB daily-rate response
        run: |
          curl -fsSL --max-time 25 'https://api.frankfurter.dev/v1/2024-01-01..2024-12-31?base=EUR&symbols=JPY' -o /tmp/pr1139-ecb-2024.json
          python3 -c 'import json; d=json.load(open("/tmp/pr1139-ecb-2024.json")); dates=sorted(d["rates"]); print("Frankfurter ECB 2024 daily dates:", len(dates), "first:", dates[0], "last:", dates[-1]); assert 240 <= len(dates) <= 270'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.106.0
          github-token: ${{ github.token }}
      - name: Start Supabase
        run: supabase start -x "$SUPABASE_START_EXCLUDE"
      - name: Update schema snapshot and check
        run: |
          npm run db:schema:snapshot:update
          npm run db:schema:snapshot:check
      - name: Reset database fixtures
        run: supabase db reset
      - name: Run database tests and SECURITY DEFINER smoke
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' --set ON_ERROR_STOP=1 --file scripts/security-definer-smoke.sql
          supabase test db
      - name: Database concurrency shell scripts
        run: |
          for script in supabase/tests/database/*.sh; do
            echo "Running $script"
            bash "$script"
          done
      - name: Verify Storybook builds
        run: npm run build-storybook
      - name: Commit formatting and schema snapshot
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: 整理汇率 review 修改格式并更新快照'
            git push origin HEAD:feat/1139_convert_totals_to_ledger_currency
          fi

  test-shard:
    name: Vitest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/1139_convert_totals_to_ledger_currency
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Run Vitest shard
        run: npm test -- --shard=${{ matrix.shard }}/4
