name: "Temporary #247: real 390px Storybook screenshots"
on:
  push:
    branches: [feature/247_cross_currency_transfer]
permissions:
  contents: write
concurrency:
  group: issue-247-screenshot-one-at-a-time
  cancel-in-progress: true
jobs:
  screenshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/247_cross_currency_transfer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Generate schema snapshot
        run: |
          version="$(cat .supabase-version)"
          npx --yes "supabase@${version}" start
          npm run db:schema:snapshot:update
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema_snapshot/current_schema.sql
          if ! git diff --cached --quiet; then
            git commit -m 'chore: 更新转账删除修复后的数据库快照'
          fi
      - name: Build Storybook
        run: npm run build-storybook
      - name: Install screenshot browser
        run: |
          npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Capture real 390px screenshots
        run: |
          mkdir -p /tmp/cross-247
          python3 -m http.server 6006 --bind 127.0.0.1 --directory storybook-static >/tmp/storybook-247.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:6006/index.json >/dev/null; then break; fi
            sleep 1
          done
          for entry in \
            "organisms-transactions-transferreceipt--cross-currency-filled:filled" \
            "organisms-transactions-transferreceipt--cross-currency-missing-target:missing" \
            "organisms-transactions-transferreceipt--cross-currency-read-only:read-only" \
            "molecules-transactions-transactionrow--cross-currency-transfer-247:list"; do
            story="${entry%%:*}"
            name="${entry##*:}"
            npx --yes playwright@1.56.0 screenshot --browser chromium \
              --viewport-size="390,844" --color-scheme="light" \
              --wait-for-timeout=3500 \
              "http://127.0.0.1:6006/iframe.html?id=${story}&viewMode=story" \
              "/tmp/cross-247/${name}.png"
          done
      - name: Composite 390px screens
        run: |
          python3 -m venv /tmp/cross-247/venv
          /tmp/cross-247/venv/bin/pip install --quiet Pillow
          mkdir -p docs/screenshots
          /tmp/cross-247/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          paths = ["/tmp/cross-247/" + name + ".png"
                   for name in ("filled", "missing", "read-only", "list")]
          images = [Image.open(path).convert("RGB") for path in paths]
          assert all(im.size == (390, 844) for im in images), [im.size for im in images]
          gap, margin = 20, 20
          w, h = 4 * 390 + 3 * gap + 2 * margin, 844 + 2 * margin
          out = Image.new("RGB", (w, h), "#FDF8F0")
          for i, im in enumerate(images):
              out.paste(im, (margin + i*(390+gap), margin))
          out.save("docs/screenshots/issue-247-cross-currency-390.png", optimize=True)
          print("Screenshot composite:", w, "x", h)
          PY
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/issue-247-cross-currency-390.png
          git commit -m 'docs: 附上跨币种转账 390px Storybook 截图'
          git push origin HEAD:feature/247_cross_currency_transfer
      - uses: actions/upload-artifact@v4
        with:
          name: issue-247-real-storybook-screenshots
          path: docs/screenshots/issue-247-cross-currency-390.png
