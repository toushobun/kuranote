name: Temporary format artifact

on:
  pull_request:
    branches: [main]

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write \
            src/components/molecules/transactions/TransactionDateTimePicker/TransactionDateTimePicker.test.tsx \
            src/components/molecules/transactions/TransactionDateTimePicker/dateTimePickerUtils.test.ts \
            src/components/molecules/ui/SectionCard.stories.tsx \
            src/components/molecules/ui/SectionCard.test.tsx \
            src/components/organisms/auth/RegisterForm/useRegisterForm.test.ts \
            src/components/organisms/ledgers/LedgerInviteEntry/useLedgerInviteEntry.test.ts \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts \
            src/components/organisms/transactions/TransactionItemsSection/TransactionItemsSection.test.tsx \
            src/components/organisms/transactions/TransactionSelectionValue/TransactionSelectionValue.stories.tsx \
            src/components/organisms/transactions/TransactionSelectionValue/TransactionSelectionValue.test.tsx \
            src/components/organisms/transactions/TransactionSummarySection/TransactionSummarySection.test.tsx \
            src/components/organisms/transactions/TransactionTagSection/TransactionTagSection.test.tsx
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-frontend-tests
          path: |
            src/components/molecules/transactions/TransactionDateTimePicker/TransactionDateTimePicker.test.tsx
            src/components/molecules/transactions/TransactionDateTimePicker/dateTimePickerUtils.test.ts
            src/components/molecules/ui/SectionCard.stories.tsx
            src/components/molecules/ui/SectionCard.test.tsx
            src/components/organisms/auth/RegisterForm/useRegisterForm.test.ts
            src/components/organisms/ledgers/LedgerInviteEntry/useLedgerInviteEntry.test.ts
            src/components/organisms/transactions/TransactionForm/useTransactionForm.test.ts
            src/components/organisms/transactions/TransactionItemsSection/TransactionItemsSection.test.tsx
            src/components/organisms/transactions/TransactionSelectionValue/TransactionSelectionValue.stories.tsx
            src/components/organisms/transactions/TransactionSelectionValue/TransactionSelectionValue.test.tsx
            src/components/organisms/transactions/TransactionSummarySection/TransactionSummarySection.test.tsx
            src/components/organisms/transactions/TransactionTagSection/TransactionTagSection.test.tsx
