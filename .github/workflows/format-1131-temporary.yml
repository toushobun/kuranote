name: Temporary formatting for Issue 1131
on:
  push:
    branches:
      - feat/1131_export_receipt_photos
      - feat/1131_import_receipt_photos
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show formatted source patch
        run: |
          npx prettier . --write >/dev/null
          git diff -- src
