name: Temporary formatting for Issue 1131
on:
  push:
    branches:
      - feat/1131_import_receipt_photos
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show formatted source patch
        run: |
          npx prettier . --write >/dev/null
          git diff -- src
          echo "__DIFF_END__"
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm test
