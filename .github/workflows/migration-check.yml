name: Migration check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  apply-review-fixes:
    if: github.event.pull_request.head.ref == 'feature/551_transaction_item_special_status'
    name: Apply PR 568 review fixes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          paths = (
              '.github/codex/pr568-patch-00.b64',
              '.github/codex/pr568-patch-01.b64',
              '.github/codex/pr568-patch-02.b64',
          )
          parts = []
          for path in paths:
              part = ''.join(Path(path).read_text().split())
              print(path, len(part), hashlib.sha256(part.encode()).hexdigest())
              parts.append(part)
          encoded = ''.join(parts)
          Path('/tmp/codex_pr568_fix.py').write_bytes(
              gzip.decompress(base64.b64decode(encoded))
          )
          PY
          python /tmp/codex_pr568_fix.py

      - name: Install dependencies and format
        shell: bash
        run: |
          npm ci
          npx prettier --write \
            src/internal/db-types.ts \
            src/internal/transaction \
            src/types/transactions.ts \
            app/'(protected)'/transactions/'[transactionRecordId]'/edit/page.tsx \
            src/components/templates/transactions/TransactionFormPage.tsx \
            src/components/organisms/transactions/TransactionGroupList/TransactionGroupList.tsx \
            src/components/organisms/transactions/TransactionItemPickerDrawer/TransactionItemPickerDrawer.tsx \
            src/components/organisms/transactions/TransactionForm/useTransactionForm.ts \
            src/components/organisms/transactions/TransactionForm/TransactionForm.tsx

      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          git show 7d77420b655ba943e6d17c61d83304816374c177:.github/workflows/migration-check.yml > .github/workflows/migration-check.yml
          git rm \
            .github/codex/pr568-patch-00.b64 \
            .github/codex/pr568-patch-01.b64 \
            .github/codex/pr568-patch-02.b64 \
            .github/workflows/codex-pr568-apply.yml \
            .github/workflows/codex-pr568-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: 修复交易明细特殊状态评审问题'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  migration-check:
    name: Migration check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration check scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA...$HEAD_SHA" -- \
            supabase/migrations \
            supabase/tests/database \
            .github/workflows/migration-check.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check SECURITY DEFINER search_path
        if: steps.scope.outputs.run == 'true'
        run: npm run db:security-definer:check

      - name: Setup Supabase CLI
        if: steps.scope.outputs.run == 'true'
        uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Run database tests
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          supabase test db
          bash supabase/tests/database/category_reorder_concurrency.sh
          bash supabase/tests/database/category_reorder_write_concurrency.sh

      - name: Stop local Supabase
        if: always() && steps.scope.outputs.run == 'true'
        run: supabase stop --no-backup > /dev/null 2>&1

      - name: Check required configuration
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "SUPABASE_DB_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "SUPABASE_PROJECT_REF is not set."
            exit 1
          fi

      - name: Link Supabase project
        if: steps.scope.outputs.run == 'true'
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Check migrations dry run
        if: steps.scope.outputs.run == 'true'
        run: supabase db push --dry-run
