name: Migration check

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check migration check scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            supabase/migrations \
            supabase/tests/database \
            .github/workflows/migration-check.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # detect-changes 与本 job 需要同时加入 branch protection 的 required status
  # checks：本 job 命中 needs.detect-changes.outputs.run != 'true' 时会显示为
  # Skipped（GitHub 视为通过，不阻止 merge）；只有 detect-changes 也被设为
  # required check，detect-changes 自身出错时才会被单独判定为失败，不会被
  # "跳过=通过" 的逻辑掩盖。
  migration-check:
    name: Migration check
    needs: detect-changes
    if: needs.detect-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check SECURITY DEFINER search_path
        run: npm run db:security-definer:check

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: v2.106.0
          github-token: ${{ github.token }}

      - name: Start local Supabase
        shell: bash
        run: |
          if ! supabase start > /tmp/supabase-start.log 2>&1; then
            cat /tmp/supabase-start.log
            exit 1
          fi

      - name: Run database tests
        shell: bash
        run: |
          supabase test db
          bash supabase/tests/database/category_reorder_concurrency.sh
          bash supabase/tests/database/category_reorder_write_concurrency.sh

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup > /dev/null 2>&1

      - name: Check required configuration
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "SUPABASE_DB_PASSWORD is not set."
            exit 1
          fi
          if [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "SUPABASE_PROJECT_REF is not set."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "${SUPABASE_PROJECT_REF}"

      - name: Check migrations dry run
        run: supabase db push --dry-run
