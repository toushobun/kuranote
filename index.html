<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KuraNote · Storybook 预览</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;min-height:100vh;background:#fdf8f0;color:#423326;display:grid;place-items:center}
    main{box-sizing:border-box;max-width:560px;margin:24px;padding:32px;border:1px solid #efe2d2;border-radius:20px;background:#fffdf8;box-shadow:0 8px 24px #45321b0d}
    h1{margin:0 0 12px;font-size:24px}
    p{line-height:1.7;margin:0 0 16px}
    a{color:#a65e06}
    small{color:#786b5c}
  </style>
</head>
<body>
  <main>
    <h1>KuraNote · Storybook 预览</h1>
    <p>这里用于发布当前 Pull Request 的 Storybook 静态预览。每个开放中的 PR 会在 <code>/kuranote/pr-N/</code> 下生成对应页面；PR 关闭后预览将自动清理。</p>
    <p><a href="https://github.com/toushobun/kuranote/pulls">查看 KuraNote Pull Requests</a></p>
    <small>正式记账应用：<a href="https://kuranote.vercel.app/">kuranote.vercel.app</a></small>
  </main>
</body>
</html>
